<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسبار AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#14213d;--mu:#667085;--ln:#e4e7ee;--ac:#1d4ed8;--acs:#e3ebff;--gold:#c8962b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--sf:#18203a;--tx:#eef1fb;--mu:#98a2bd;--ln:#2a3354;--acs:#1e2b57}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;padding-bottom:70px}
.pro{--ac:#15803d;--acs:#dcf5e5}
@media (prefers-color-scheme:dark){.pro{--acs:#173826}}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:18px;margin:0;flex:1}
.hat{font-size:28px;cursor:pointer;user-select:none;background:none;border:0;padding:0}
main{padding:16px;max-width:640px;margin:auto}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}
.mu{color:var(--mu);font-size:13px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:600 14px Cairo,sans-serif;cursor:pointer;min-height:44px}
button.s{background:var(--acs);color:var(--ac)}
button.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:400 15px Cairo,sans-serif;margin:4px 0 8px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 2px;font:600 11px Cairo,sans-serif;color:var(--mu);min-height:54px;cursor:pointer}
nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:20px}
.out{white-space:pre-wrap;line-height:1.9;background:var(--acs);border-radius:12px;padding:12px;font-size:14px}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:80%;background:var(--sf);border:1px solid var(--ln)}
.msg.me{background:var(--ac);color:#fff;margin-inline-start:auto;border-color:var(--ac)}
.hero{text-align:center;padding:40px 16px 10px}.hero .hat{font-size:64px}
.hero h1{font-size:30px;margin:6px 0}
.tog{width:50px;height:28px;border-radius:14px;background:var(--ln);border:0;position:relative;cursor:pointer}
.tog.on{background:var(--ac)}.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on::after{inset-inline-start:25px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}.mc{background:var(--sf);padding:16px;border-radius:14px;width:min(320px,90%)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
var S={role:null,tab:0,taps:0,code:"1234",
bag:[{n:"محاضرات الفصل الأول",f:["المحاضرة 1.pdf","المحاضرة 2.docx"]},{n:"الاختبارات",f:["اختبار تجريبي.pdf"]}],
classes:[{n:"الأحياء - الصف الخامس",c:"AB12",h:["المحاضرة 1.pdf","المحاضرة 2.docx"]}],
joined:["AB12"],open:null,out:"",
price:{m:5000,y:45000},trial:7,
users:[{n:"زينب أحمد",on:true},{n:"د. حسن علي",on:true},{n:"مصطفى كريم",on:false}],
chat:[["من يحتاج ملزمة الأسبوع القادم؟",0],["أنا يا أستاذ",1]]};
var $=function(i){return document.getElementById(i)},tmr;
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(tmr);tmr=setTimeout(function(){e.style.display="none"},1800)}
function ask(l,cb,pw){var d=document.createElement("div");d.id="md";d.innerHTML='<div class="mc"><b>'+l+'</b><input id="mi" '+(pw?'type="password" inputmode="numeric" ':'')+'><div class="row"><button class="b grow" id="mk">موافق</button><button class="b s grow" id="mx">إلغاء</button></div></div>';document.body.appendChild(d);var i=$("mi");i.focus();function c(){d.remove()}$("mx").onclick=c;$("mk").onclick=function(){var v=i.value.trim();c();if(v)cb(v)};i.onkeydown=function(e){if(e.key=="Enter")$("mk").click()}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ai(kind,topic){var t=esc(topic);return{
"شرح مبسط":"شرح مبسط لـ «"+t+"»:\n١) الفكرة الأساسية بجملة واحدة.\n٢) مثال من الحياة اليومية.\n٣) أهم نقطة تتذكرها بالامتحان.",
"ترجمة":"ترجمة «"+t+"» إلى الإنجليزية ستظهر هنا مع المصطلحات العلمية بجانب كل فقرة.",
"تلخيص":"ملخص «"+t+"» بخمس نقاط قصيرة جاهز للمراجعة السريعة.",
"أسئلة":"س١: ما المقصود بالموضوع الرئيسي في «"+t+"»؟\nأ) …  ب) …  ج) …  د) …\nس٢: علّل سبب أهمية الموضوع.\nس٣: صح أم خطأ: …",
"اختبار":"اختبار من «"+t+"»: ١٠ أسئلة، المدة ١٥ دقيقة، مع تصحيح فوري وعرض الدرجة."}[kind]}
function setRole(r){S.role=r;S.tab=0;S.out="";S.open=null;draw()}
function tab(i){S.tab=i;S.out="";S.open=null;draw()}
function hat(){S.taps++;clearTimeout(S._t);S._t=setTimeout(function(){S.taps=0},2000);
if(S.taps>=5){S.taps=0;ask("أدخل رمز المالك",function(c){if(c===S.code)setRole("own");else toast("الرمز غير صحيح")},1)}}
function head(t){return '<header><button class="hat" aria-label="مسبار" onclick="hat()">🎓</button><h1>'+t+'</h1>'+(stat()?'<button class="b s" onclick="S.subv=1;draw()">'+stat()+'</button>':'')+(S.role?'<button class="b s" onclick="setRole(null)">خروج</button>':'')+'</header>'}
function navb(items){return '<nav>'+items.map(function(x,i){return '<button class="'+(S.tab==i?'on':'')+'" onclick="tab('+i+')"><i>'+x[0]+'</i>'+x[1]+'</button>'}).join("")+'</nav>'}
function chatV(){return comV()+'<h2>المحادثة</h2><div class="card">'+S.chat.map(function(m){return '<div class="msg'+(m[1]?' me':'')+'">'+esc(m[0])+'</div>'}).join("")+'<div class="row"><input id="ci" placeholder="اكتب رسالة" class="grow"><button class="b" onclick="send()">إرسال</button></div></div>'}
S.posts=[["د. حسن علي","ملزمة جديدة عن الخلية متاحة بالكلاس"],["زينب أحمد","هل أحد عنده ملخص الفصل الثاني؟"]];S.tx="";S.pend="";S.cd="";S.gr=[["زينب أحمد",18],["مصطفى كريم",15]];
function comV(){return '<h2>المجتمع</h2><div class="card">'+S.posts.map(function(p){return '<div style="padding:6px 0;border-bottom:1px solid var(--ln)"><b>'+esc(p[0])+'</b><div>'+esc(p[1])+'</div></div>'}).join("")+'<div class="row"><input id="po" placeholder="شارك سؤالاً أو ملزمة" class="grow"><button class="b" onclick="post()">نشر</button></div></div>'}
function post(){var v=$("po").value.trim();if(v){S.posts.unshift(["أنا",v]);draw()}}
function txtV(){return '<h2>مختبر النص</h2><div class="card"><label>اكتب النص أو ارفع ملفاً</label><textarea id="tt" rows="6">'+esc(S.tx)+'</textarea><button class="b s" onclick="upT()">📎 رفع ملف نصي</button><div class="grid" style="margin-top:8px"><button class="b" onclick="tl(\'استلال\')">فحص الاستلال</button><button class="b" onclick="tl(\'ذكاء\')">فحص الذكاء الاصطناعي</button><button class="b" onclick="tl(\'صياغة\')">إعادة صياغة</button></div></div>'+(S.out?'<div class="out">'+S.out+'</div><div class="mu" style="margin-top:6px">نتيجة تجريبية، والفحص الحقيقي يُربط بالمرحلة الثانية.</div>':'')}
function upT(){var f=document.createElement("input");f.type="file";f.accept=".txt";f.onchange=function(){var r=new FileReader();r.onload=function(){S.tx=r.result;draw()};r.readAsText(f.files[0])};f.click()}
function tl(k){S.tx=$("tt").value;if(!S.tx.trim()){toast("اكتب نصاً أولاً");return}var n=S.tx.trim().split(/\s+/).length;S.out=k=="استلال"?"فحص الاستلال: "+n+" كلمة. ستظهر نسبة التشابه مع المصادر.":k=="ذكاء"?"فحص الذكاء الاصطناعي: "+n+" كلمة. ستظهر نسبة احتمال الكتابة الآلية والجمل المشبوهة.":"إعادة الصياغة: ستظهر نسخة بصياغة جديدة تحافظ على المعنى.";draw()}
function grV(){return '<h2>دفتر الدرجات</h2><div class="card"><label>مثال: زينب 18 مصطفى 15</label><textarea id="gi" rows="3">'+esc(S.pend)+'</textarea><div class="grid"><button class="b" onclick="mic()">🎙️ صوت</button><button class="b" onclick="cam()">📷 تصوير</button></div><button class="b s" style="margin-top:8px;width:100%" onclick="addG()">إضافة للدفتر</button></div><div class="card">'+S.gr.map(function(g){return '<div class="row" style="padding:5px 0"><span class="grow">'+esc(g[0])+'</span><b>'+g[1]+'</b></div>'}).join("")+'<div class="mu">المعدل: '+(S.gr.reduce(function(a,g){return a+g[1]},0)/S.gr.length).toFixed(1)+'</div><button class="b s" onclick="window.print()">تنزيل PDF</button></div>'}
function mic(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("المتصفح لا يدعم الصوت، اكتب الدرجات");return}var r=new R();r.lang="ar-IQ";r.onresult=function(e){S.pend=e.results[0][0].transcript;draw()};r.onerror=function(){toast("تعذر الاستماع، تأكد من إذن المايك")};r.start();toast("تكلم الآن")}
function cam(){var f=document.createElement("input");f.type="file";f.accept="image/*";f.setAttribute("capture","environment");f.onchange=function(){toast("وصلت الصورة. قراءتها تُربط بالمرحلة الثانية، حالياً اكتب الدرجات")};f.click()}
function addG(){S.pend=$("gi").value;var m,re=/([^\d\s]+(?:\s[^\d\s]+)*)\s*(\d+(?:\.\d+)?)/g,c=0;while((m=re.exec(S.pend))){S.gr.push([m[1].trim(),parseFloat(m[2])]);c++}if(c){S.pend="";toast("أضيفت "+c+" درجة")}else toast("اكتب الاسم ثم الدرجة");draw()}
function send(){var v=$("ci").value.trim();if(v){S.chat.push([v,1]);draw()}}
function bagV(){return '<h2>حقيبتي</h2>'+S.bag.map(function(f,i){return '<div class="card"><b>📁 '+esc(f.n)+'</b>'+f.f.map(function(x){return '<div class="row mu" style="padding:6px 0"><span class="grow">📄 '+esc(x)+'</span><button class="b s" onclick="toast(\'تم الإرسال إلى الكلاس\')">إرسال للكلاس</button></div>'}).join("")+'<button class="b s" onclick="addFile('+i+')">+ رفع ملف</button></div>'}).join("")+'<button class="b" onclick="addFolder()">+ مجلد جديد</button>'}
function addFolder(){ask("اسم المجلد",function(n){S.bag.push({n:n,f:[]});draw()})}
function addFile(i){var f=document.createElement("input");f.type="file";f.accept=".pdf,.doc,.docx,.ppt,.pptx";f.onchange=function(){if(f.files[0]){S.bag[i].f.push(f.files[0].name);draw()}};f.click()}
function clsV(){return '<h2>كلاساتي</h2>'+S.classes.map(function(c){return '<div class="card"><b>'+esc(c.n)+'</b><div class="mu">رمز الدخول: '+esc(c.c)+' · '+c.h.length+' ملازم</div></div>'}).join("")+'<button class="b" onclick="addClass()">+ إنشاء كلاس</button>'}
function addClass(){ask("اسم الكلاس",function(n){S.classes.push({n:n,c:Math.random().toString(36).slice(2,6).toUpperCase(),h:[]});draw()})}
function toolsV(){return '<h2>مولّد الأسئلة</h2><div class="card"><label>الموضوع</label><input id="qt" value="التمثيل الضوئي"><div class="grid"><div><label>النوع</label><select id="qk"><option>اختيار من متعدد</option><option>مقالي</option><option>صح وخطأ</option></select></div><div><label>العدد</label><input id="qn" type="number" value="10"></div></div><button class="b" onclick="gen(\'q\')">توليد</button></div>'+
''+bankV()+'<h2>مولّد الخطط</h2><div class="card"><label>نوع الخطة</label><select id="pk"><option>يومية</option><option>أسبوعية</option><option>شهرية</option><option>سنوية</option></select><label>تكلم مع الذكاء الاصطناعي وقل له شنو تريد</label><textarea id="pi" rows="4" placeholder="مثال: سوّي لي خطة يومية بتصميم حلو، وأريد فيها وقت للمراجعة ونشاط للطلاب">'+esc(S.pi||"")+'</textarea><div class="grid"><button class="b s" onclick="micP()">🎙️ تكلم</button><button class="b" onclick="gen(\'p\')">ابدأ التصميم</button></div></div>'+planV()+''+
(S.out?'<div class="out">'+S.out+'</div><div class="row" style="margin-top:8px"><button class="b s grow" onclick="window.print()">تنزيل PDF</button><button class="b s grow" onclick="toast(\'سيُربط التصدير إلى Word بالمرحلة الثانية\')">تنزيل Word</button></div>':'')+
'<h2>التأليف</h2><div class="grid"><button class="b s" onclick="toast(\'محرر الملازم — المرحلة الثانية\')">✍️ تأليف ملزمة</button><button class="b s" onclick="toast(\'عرض PowerPoint — المرحلة الثانية\')">📊 عرض تقديمي</button></div>'}
function micP(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("المتصفح لا يدعم الصوت، اكتب طلبك");return}S.pi=$("pi").value;var r=new R();r.lang="ar-IQ";r.onresult=function(e){S.pi=(S.pi+" "+e.results[0][0].transcript).trim();draw()};r.onerror=function(){toast("تعذر الاستماع، تأكد من إذن المايك")};r.start();toast("تكلم الآن")}
S.bank=[];S.bi="";S.bt="";S.ai=[];S.used=0;S.free=5;S.prov="Claude";S.email="";S.subs=["demo@misbar.app"];S.plans=[{n:"شهري",p:5000,d:30},{n:"سنوي",p:45000,d:365}];
function isSub(){return S.subs.indexOf(S.email)>-1}
function stat(){return S.email?(isSub()?"✅ مشترك":"مجاني"):""}
function loginV(){$("app").className="";$("app").innerHTML='<div class="hero"><button class="hat" aria-label="مسبار" onclick="hat()">🎓</button><h1>مسبار AI</h1><p class="mu">سجّل دخولك بالإيميل</p></div><main><div class="card"><input id="em" type="email" dir="ltr" placeholder="you@gmail.com"><button class="b" style="width:100%" onclick="login()">تسجيل الدخول</button><div class="mu" style="margin-top:6px">تسجيل تجريبي. الدخول الحقيقي بحساب Google يُربط بالمرحلة الثانية. جرّب demo@misbar.app لترى حساب المشترك.</div></div></main>'}
function login(){var v=$("em").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(v)){toast("اكتب إيميلاً صحيحاً");return}S.email=v;S.role=null;draw()}
function aiV(){var left=Math.max(S.free-S.used,0),L={Claude:"https://claude.ai",Gemini:"https://gemini.google.com",ChatGPT:"https://chatgpt.com"};return '<h2>الذكاء الاصطناعي</h2><div class="card"><div class="mu" dir="ltr" style="text-align:start">'+esc(S.email)+'</div><div>'+(isSub()?'اشتراك فعال: استخدام كامل':'مجاني: المتبقي اليوم '+left+' رسائل')+'</div><div class="grid" style="margin-top:8px">'+["Claude","Gemini","ChatGPT"].map(function(p){return '<button class="b '+(S.prov==p?'':'s')+'" onclick="S.prov=\''+p+'\';draw()">'+p+'</button>'}).join("")+'</div><a href="'+L[S.prov]+'" target="_blank" rel="noopener" style="display:block;margin-top:8px;color:var(--ac)">فتح '+S.prov+' بالمتصفح بحسابك الخاص</a></div><div class="card">'+S.ai.map(function(m){return '<div class="msg'+(m[1]?' me':'')+'">'+esc(m[0])+'</div>'}).join("")+'<div class="row"><input id="ai" placeholder="اسأل '+S.prov+'" class="grow"><button class="b" onclick="sendAI()">إرسال</button></div></div><button class="b s" onclick="S.email=\'\';S.role=null;draw()">تغيير الحساب</button>'}
function sendAI(){var v=$("ai").value.trim();if(!v)return;if(!isSub()&&S.used>=S.free){toast("انتهى استخدامك المجاني، اشترك للمتابعة");return}if(!isSub())S.used++;S.ai.push([v,1],["رد تجريبي من "+S.prov+". الرد الحقيقي يُربط بالخادم بالمرحلة الثانية.",0]);draw()}
function plansV(){return '<h2>الاشتراكات والأسعار</h2>'+S.plans.map(function(x,i){return '<div class="card"><label>اسم الاشتراك</label><input value="'+esc(x.n)+'" onchange="S.plans['+i+'].n=this.value"><div class="grid"><div><label>السعر (د.ع)</label><input type="number" value="'+x.p+'" onchange="S.plans['+i+'].p=this.value"></div><div><label>المدة بالأيام</label><input type="number" value="'+x.d+'" onchange="S.plans['+i+'].d=this.value"></div></div><button class="b s" onclick="S.plans.splice('+i+',1);draw()">حذف</button></div>'}).join("")+'<button class="b" onclick="S.plans.push({n:\'جديد\',p:0,d:30});draw()">+ إضافة اشتراك</button><h2>المشتركون بالإيميل</h2><div class="card">'+S.subs.map(function(e,i){return '<div class="row" style="padding:4px 0"><span class="grow" dir="ltr">'+esc(e)+'</span><button class="b s" onclick="S.subs.splice('+i+',1);draw()">إلغاء</button></div>'}).join("")+'<div class="row"><input id="se" dir="ltr" placeholder="email" class="grow"><button class="b" onclick="addSub()">تفعيل</button></div></div><div class="card"><label>رسائل الذكاء المجانية يومياً</label><input type="number" value="'+S.free+'" onchange="S.free=+this.value"></div>'}
