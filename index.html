async function srcFileText(f){
  var ext=(f.name.split(".").pop()||"").toLowerCase();
  if(/^image\//.test(f.type)||/^(jpg|jpeg|png|webp)$/.test(ext)){
    if(!aiReady())throw new Error("اربط الذكاء (زر 🔑) لقراءة الصور");
    var du=await new Promise(function(r){shrinkImg(f,r)});if(!du)throw new Error("صورة غير صالحة");
    return String(await callUserGemini("اكتب كل النص الموجود في هذه الصورة كما هو بدون إضافة أو شرح.","أنت نظام OCR دقيق للنصوص العربية والإنجليزية.",du)||"");
  }
  if(ext==="pdf"){
    await loadLib(LIBS.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfw;
    var pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,txt="";
    for(var p=1;p<=Math.min(pdf.numPages,80);p++){var pg=await pdf.getPage(p),tc=await pg.getTextContent();txt+=tc.items.map(function(i){return i.str}).join(" ")+"\n"}
    if(txt.replace(/\s/g,"").length<80&&aiReady()){
      txt="";
      for(var q=1;q<=Math.min(pdf.numPages,10);q++){var pg2=await pdf.getPage(q),vp=pg2.getViewport({scale:1.6}),cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg2.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
        txt+=String(await callUserGemini("اكتب كل النص الموجود في هذه الصفحة كما هو.","أنت نظام OCR دقيق.",cv.toDataURL("image/jpeg",0.85))||"")+"\n"}
    }
    return txt;
  }
  if(ext==="docx"){await loadLib(LIBS.mammoth);return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
  if(/^(xlsx|xls)$/.test(ext)){await loadLib(LIBS.xlsx);var wb=XLSX.read(await f.arrayBuffer(),{type:"array"});return wb.SheetNames.map(function(n){return XLSX.utils.sheet_to_csv(wb.Sheets[n])}).join("\n")}
  if(/^(txt|md|csv)$/.test(ext))return await f.text();
  throw new Error("نوع غير مدعوم ("+f.name+") — استخدم PDF أو docx أو txt أو صورة");
}
function srcPick(k,mode){
  var inp=document.createElement("input");inp.type="file";inp.multiple=true;inp.accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls,image/*";
  inp.onchange=async function(){
    var fs=Array.prototype.slice.call(inp.files||[]);if(!fs.length)return;
    var o=srcOf(k);S.busy=true;draw();
    for(var i=0;i<fs.length;i++){
      var f=fs[i];toast("⏳ قراءة "+(i+1)+"/"+fs.length+": "+f.name);
      try{
        var tx=String(await srcFileText(f)||"").trim();
        if(!tx){toast("ما لقيت نصاً في "+f.name);continue}
        if(mode==="syl")o.syl=(o.syl?o.syl+"\n":"")+tx.slice(0,6000);
        else o.files.push({name:f.name,text:tx.slice(0,40000)});
      }catch(e){toast("تعذر: "+(e.message||e))}
    }
    S.busy=false;draw();
  };
  inp.click();
}

var CallTones = (function(){

    try{

    var t = c.currentTime + t0;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.setValueAtTime(vol, t + Math.max(0.03, dur - 0.05));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function stop(){
    if(iv){ clearInterval(iv); iv = null; }
    if(vib){ clearInterval(vib); vib = null; }
    try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
  }

  function ringback(){

  }

  function ring(){

    }

  }

})();

function makePipDraggable(){
  var box = document.getElementById('localVideoContainer'); if(!box) return;
  var sx, sy, ox, oy, drag = false;
  box.addEventListener('pointerdown', function(e){
    drag = true; sx = e.clientX; sy = e.clientY;
    var r = box.getBoundingClientRect(), pr = box.parentElement.getBoundingClientRect();
    ox = r.left - pr.left; oy = r.top - pr.top;
    try{ box.setPointerCapture(e.pointerId); }catch(err){}
  });
  box.addEventListener('pointermove', function(e){
    if(!drag) return;
    var pr = box.parentElement.getBoundingClientRect();
    var nx = Math.min(Math.max(0, ox + e.clientX - sx), pr.width - box.offsetWidth);
    var ny = Math.min(Math.max(0, oy + e.clientY - sy), pr.height - box.offsetHeight);
    box.style.left = nx + 'px'; box.style.top = ny + 'px'; box.style.right = 'auto';
  });
  var up = function(){ drag = false; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
}

/* ------------------------------ الوسائط ------------------------------ */
function callVideoConstraints(){
  return { facingMode: { ideal: RTC.facing }, width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 24, max: 30 } };
}
function getCallMedia(wantVideo){
  var audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  return navigator.mediaDevices.getUserMedia({ audio: audio, video: wantVideo ? callVideoConstraints() : false }).catch(function(e){
    var n = e && e.name;
    if(wantVideo && (n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'NotReadableError')){
      toast('الكاميرا غير متاحة، سيستمر الاتصال بالصوت فقط');
      return navigator.mediaDevices.getUserMedia({ audio: audio });
    }
    throw e;
  });
}
function mediaErrMsg(e){
  var n = e && e.name;
  if(n === 'NotAllowedError' || n === 'SecurityError') return 'اسمح للتطبيق باستخدام المايكروفون والكاميرا من إعدادات الهاتف';
  if(n === 'NotFoundError') return 'لا يوجد مايكروفون في هذا الجهاز';
  if(n === 'NotReadableError') return 'المايكروفون أو الكاميرا مستخدمة من تطبيق آخر';
  return 'تعذر تشغيل المايكروفون/الكاميرا';
}
function stopStream(s){ if(s) s.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); }
function videoTransceiver(){
  if(!RTC.pc) return null;
  var list = RTC.pc.getTransceivers();
  for(var i = 0; i < list.length; i++){
    var t = list[i];
    if(t.receiver && t.receiver.track && t.receiver.track.kind === 'video') return t;
  }
  return null;
}

/* ------------------------------- الإشارة ------------------------------- */
function callRef(){ return window.fbGetDocRef('calls', RTC.callId); }
function sigCol(){ return window.fbGetColRef(callRef(), 'signals'); }
function onSigErr(e){
  console.log('signals listener error', e && e.code);
  RTC.sigErr = true;
  if(e && e.code === 'permission-denied') toast('⚠️ قواعد Firestore لا تسمح بإشارات المكالمة، انشر ملف firestore.rules الجديد');
}
function sendSignal(o){
  if(!RTC.callId) return Promise.resolve();
  o.from = S.email; o.at = Date.now(); o.seq = Date.now() * 100 + (RTC.seqN++ % 100);
  return window.fbAddDoc(sigCol(), o).catch(function(e){ console.log('signal send error', e); RTC.sigErr = true; if(e && e.code === 'permission-denied' && !RTC.sigToast){ RTC.sigToast = true; toast('⚠️ قواعد Firestore لا تسمح بإشارات المكالمة، انشر ملف firestore.rules الجديد'); } });
}
function sendCallState(){
  if(RTC.pc) sendSignal({ type: 'state', cam: !!RTC.camOn, mic: !RTC.muted });
}
function setCallDoc(data){
  if(!RTC.callId) return Promise.resolve();
  return window.fbUpdateDoc(callRef(), data).catch(function(e){ console.log('call doc update error', e); });
}

var ICE_CACHE = { list: null, at: 0, p: null };
function fetchIceList(){
  if(!CALL_CFG.turnApiUrl) return Promise.resolve();
  if(ICE_CACHE.list && Date.now() - ICE_CACHE.at < 3600000) return Promise.resolve();
  if(ICE_CACHE.p) return ICE_CACHE.p;
  ICE_CACHE.p = new Promise(function(res){
    var done = false;
    var t = setTimeout(function(){ if(!done){ done = true; res(); } }, 4000);
    fetch(CALL_CFG.turnApiUrl).then(function(r){ return r.json(); }).then(function(j){
      if(Array.isArray(j) && j.length){ ICE_CACHE.list = j; ICE_CACHE.at = Date.now(); }
    }).catch(function(e){ console.log('turn fetch error', e); }).then(function(){
      clearTimeout(t); ICE_CACHE.p = null; if(!done){ done = true; res(); }
    });
  });
  return ICE_CACHE.p;
}

/* قراءة إعدادات TURN التي حفظها المالك في Firestore (config/turn) */
var TURN_LOAD = { p: null };
function loadTurnConfig(force){
  if(TURN_LOAD.p && !force) return TURN_LOAD.p;
  if(!window.fbLoadTurnConfig) return Promise.resolve();
  TURN_LOAD.p = window.fbLoadTurnConfig().then(function(c){
    if(c && (c.api || c.servers)){
      CALL_CFG.turnApiUrl = c.api || CALL_CFG.turnApiUrl;
      var arr = [];
      if(c.servers){ try{ var j = JSON.parse(c.servers); if(Array.isArray(j)) arr = j; }catch(e){} }
      CALL_CFG.turn = arr;
      ICE_CACHE.list = null; ICE_CACHE.at = 0;
    }
    return fetchIceList();
  }).catch(function(e){
    console.log('turn config load error', e && e.code);
    TURN_LOAD.p = null; /* نعيد المحاولة في المكالمة القادمة */
  });
  return TURN_LOAD.p;
}
function prefetchIce(){ return loadTurnConfig(false).then(fetchIceList); }

/* اختبار سيرفر TURN: هل نحصل على مسار وسيط (relay) فعلاً؟ */
function testTurnServer(){
  toast('جاري اختبار السيرفر...');
  loadTurnConfig(true).then(function(){
    var servers = (ICE_CACHE.list || []).concat(CALL_CFG.turn || []);
    if(!servers.length){ toast('⚠️ لا توجد سيرفرات TURN: احفظ الرابط أولاً أو تأكد أنه يرجع بيانات'); return; }
    var pc = new RTCPeerConnection({ iceServers: servers, iceTransportPolicy: 'relay' }), found = false;
    pc.onicecandidate = function(e){ if(e.candidate && / typ relay /.test(e.candidate.candidate)) found = true; };
    pc.createDataChannel('t');
    pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).catch(function(){});
    setTimeout(function(){
      try{ pc.close(); }catch(e){}
      toast(found ? '✅ سيرفر TURN يعمل (' + servers.length + ' مسار)' : '❌ لم نحصل على مسار وسيط: تأكد من الرابط أو الحصة المتبقية');
    }, 6000);
  });
}

function callIceServers(){
  var list = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: ['stun:stun2.l.google.com:19302', 'stun:stun3.l.google.com:19302'] }
  ];
  return { iceServers: list.concat(ICE_CACHE.list || [], CALL_CFG.turn || []), bundlePolicy: 'max-bundle', iceCandidatePoolSize: 4 };
}

function createPeer(){
  var pc = new RTCPeerConnection(callIceServers());
  RTC.pc = pc;
  pc.onicecandidate = function(e){
    if(e.candidate) sendSignal({ type: 'cand', data: JSON.stringify(e.candidate.toJSON ? e.candidate.toJSON() : e.candidate) });
  };
  pc.ontrack = function(e){
    if(e.streams && e.streams[0]) RTC.remote = e.streams[0];
    else { if(!RTC.remote) RTC.remote = new MediaStream(); RTC.remote.addTrack(e.track); }
    attachRemote();
  };
  pc.onnegotiationneeded = function(){ if(RTC.negReady) makeOffer(false); };
  pc.oniceconnectionstatechange = onIceState;
  RTC.unsubs.push(window.fbOnSnapshot(sigCol(), onSignals, onSigErr));
}

function makeOffer(restart){
  var pc = RTC.pc;
  if(!pc || pc.signalingState === 'closed') return Promise.resolve();
  RTC.makingOffer = true;
  return pc.createOffer(restart ? { iceRestart: true } : undefined).then(function(o){
    if(pc.signalingState !== 'stable') return;
    return pc.setLocalDescription(o).then(function(){
      return sendSignal({ type: 'offer', sdp: pc.localDescription.sdp });
    });
  }).catch(function(e){ console.log('offer error', e); }).then(function(){ RTC.makingOffer = false; });
}

function onSignals(snap){
  var list = [];
  snap.docChanges().forEach(function(ch){
    if(ch.type !== 'added') return;
    var d = ch.doc.data();
    if(d && d.from !== S.email) list.push(d);
  });
  list.sort(function(a, b){ return (a.seq || 0) - (b.seq || 0); });
  list.forEach(function(d){
    RTC.chain = RTC.chain.then(function(){ return handleSignal(d); }).catch(function(e){ console.log('signal error', e); });
  });
}

function flushPending(){
  var pc = RTC.pc; if(!pc || !pc.remoteDescription) return Promise.resolve();
  var q = RTC.pending; RTC.pending = [];
  return Promise.all(q.map(function(c){ return pc.addIceCandidate(c).catch(function(){}); }));
}

function handleSignal(d){
  var pc = RTC.pc; if(!pc || pc.signalingState === 'closed') return Promise.resolve();
  if(d.type === 'cand'){
    var cand; try{ cand = new RTCIceCandidate(JSON.parse(d.data)); }catch(e){ return Promise.resolve(); }
    if(!pc.remoteDescription){ RTC.pending.push(cand); return Promise.resolve(); }
    return pc.addIceCandidate(cand).catch(function(){});
  }
  if(d.type === 'state'){
    RTC.remoteCam = !!d.cam; RTC.remoteMic = d.mic !== false; updateRemoteUI();
    return Promise.resolve();
  }
  if(d.type === 'offer'){
    var collision = RTC.makingOffer || pc.signalingState !== 'stable';
    if(collision && !RTC.polite) return Promise.resolve();
    var p = Promise.resolve();
    if(collision) p = pc.setLocalDescription({ type: 'rollback' }).catch(function(){});
    return p.then(function(){
      return pc.setRemoteDescription({ type: 'offer', sdp: d.sdp });
    }).then(function(){
      RTC.gotRemote = true;
      if(!RTC.isCaller && !RTC.tracksAdded && RTC.local){
        RTC.tracksAdded = true;
        RTC.local.getTracks().forEach(function(t){ pc.addTrack(t, RTC.local); });
      }
      return flushPending();
    }).then(function(){ return pc.createAnswer(); })
      .then(function(a){ return pc.setLocalDescription(a); })
      .then(function(){
        RTC.negReady = true;
        return sendSignal({ type: 'answer', sdp: pc.localDescription.sdp });
      });
  }
  if(d.type === 'answer'){
    if(pc.signalingState !== 'have-local-offer') return Promise.resolve();
    return pc.setRemoteDescription({ type: 'answer', sdp: d.sdp }).then(function(){ RTC.gotRemote = true; return flushPending(); });
  }
  return Promise.resolve();
}

/* سبب فشل الاتصال بشكل واضح بدل "جاري الاتصال" للأبد */
function connectFailReason(){
  if(RTC.sigErr) return 'تعذر الاتصال: قواعد Firestore تمنع المكالمة';
  if(!RTC.gotRemote) return 'تعذر الاتصال: لم يصل رد من الطرف الآخر';
  return (ICE_CACHE.list || (CALL_CFG.turn && CALL_CFG.turn.length)) ? 'تعذر الاتصال: الشبكة تمنع الاتصال' : 'تعذر الاتصال: الشبكة تحتاج سيرفر TURN';
}

/* ---------------------------- حالة الاتصال ---------------------------- */
function onIceState(){
  var pc = RTC.pc; if(!pc) return;
  var st = pc.iceConnectionState;
  if(st === 'connected' || st === 'completed'){
    clearTimeout(RTC.reconT); clearTimeout(RTC.failT);
    if(!RTC.connected) onCallConnected(); else setCallOverride('');
  } else if(st === 'disconnected'){
    if(RTC.connected) setCallOverride('ضعف في الاتصال...');
    clearTimeout(RTC.reconT);
    RTC.reconT = setTimeout(restartIceNow, 3500);
  } else if(st === 'failed'){
    if(RTC.connected) setCallOverride('جاري إعادة الاتصال...');
    restartIceNow();
    clearTimeout(RTC.failT);
    RTC.failT = setTimeout(function(){
      var s2 = RTC.pc && RTC.pc.iceConnectionState;
      if(s2 !== 'connected' && s2 !== 'completed') finalizeCall('ended', false, RTC.connected ? 'انقطع الاتصال' : connectFailReason());
    }, 15000);
  }
}
function restartIceNow(){
  if(!RTC.pc || RTC.polite) return; /* المتصل فقط يبدأ إعادة المحاولة */
  try{
    if(RTC.pc.restartIce) RTC.pc.restartIce(); else makeOffer(true);
  }catch(e){}
}

function onCallConnected(){
  RTC.connected = true; RTC.startTime = Date.now();
  clearTimeout(RTC.ringT); clearTimeout(RTC.connT);
  CallTones.stop(); CallTones.connected();
  setCallOverride('');
  if(RTC.timer) clearInterval(RTC.timer);
  RTC.timer = setInterval(renderCallStatus, 1000);
  renderCallStatus();
  attachRemote(); attachLocal(); updateCallButtons();
  scanOutputs().then(applyAudioRoute);
  sendCallState();
  if(RTC.isCaller) setCallDoc({ status: 'connected', connectedAt: Date.now() });
  try{
    if(navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').then(function(w){ RTC.wake = w; }).catch(function(){});
  }catch(e){}
}

function onCallDoc(snap){
  var d = (snap && snap.exists()) ? snap.data() : null;
  if(!RTC.callId || RTC.finishing) return;
  if(!d){ finalizeCall('ended', true, 'انتهت المكالمة'); return; }
  var st = d.status;
  if(RTC.isCaller){
    if(st === 'ringing' && !RTC.offerStarted) setCallStatus('يرن...');
    else if(st === 'accepted' && !RTC.offerStarted) startNegotiation();
    else if(st === 'rejected') finalizeCall(st, true, 'رفض المكالمة');
    else if(st === 'busy') finalizeCall(st, true, 'الخط مشغول');
    else if(st === 'ended') finalizeCall(st, true, 'انتهت المكالمة');
  } else {
    if(st === 'canceled' || st === 'missed') finalizeCall(st, true, 'مكالمة فائتة');
    else if(st === 'ended') finalizeCall(st, true, 'انتهت المكالمة');
  }
}

/* المتصل: بعد قبول الطرف الآخر نبدأ التفاوض بمرشحات ICE جديدة */
function startNegotiation(){
  if(RTC.offerStarted || !RTC.local) return;
  RTC.offerStarted = true;
  clearTimeout(RTC.ringT);
  CallTones.stop();
  setCallStatus('جاري الاتصال...');
  if(!RTC.pc) createPeer();
  RTC.negReady = true;
  RTC.local.getTracks().forEach(function(t){ RTC.pc.addTrack(t, RTC.local); });
  RTC.tracksAdded = true;
  RTC.connT = setTimeout(function(){
    if(!RTC.connected) finalizeCall('ended', false, connectFailReason());
  }, CALL_CFG.connectTimeout);
}

/* ------------------------------ بدء/رد/إنهاء ------------------------------ */
function startCall(peerEmail, wantVideo){
  if(RTC.callId){ toast('أنت في مكالمة حالياً'); return; }
  peerEmail = String(peerEmail || '').toLowerCase();
  if(!peerEmail || peerEmail === S.email){ toast('لا يمكن الاتصال بهذا الحساب'); return; }
  if(S.blocked && S.blocked.indexOf(peerEmail) > -1){ toast('هذا الشخص محظور، فك الحظر أولاً'); return; }
  if(!window.fbSetDoc || !window.fbGetDocRef){ toast('الاتصال بالسيرفر غير جاهز، جرّب بعد لحظة'); return; }
  if(!window.RTCPeerConnection || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('هذا المتصفح لا يدعم المكالمات (يلزم رابط https)'); return;
  }
  resetRTC();
  var myId = 'call_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  RTC.callId = myId; RTC.isCaller = true; RTC.polite = false; RTC.peerEmail = peerEmail;
  RTC.type = wantVideo ? 'video' : 'audio';
  RTC.speakerOn = !!wantVideo;
  renderCallUI();
  setCallStatus('جاري الاتصال...');

  Promise.all([getCallMedia(wantVideo), prefetchIce()]).then(function(r){
    var stream = r[0];
    if(RTC.callId !== myId){ stopStream(stream); return; }
    RTC.local = stream;
    RTC.camOn = stream.getVideoTracks().length > 0;
    if(!RTC.camOn) RTC.type = 'audio';
    attachLocal(); updateCallButtons();
    return window.fbSetDoc(callRef(), {
      caller: S.email, callee: peerEmail, type: RTC.type, status: 'calling', at: Date.now(),
      callerName: S.dispName || S.email.split('@')[0]
    }).then(function(){
      if(RTC.callId !== myId) return;
      RTC.unsubs.push(window.fbOnSnapshot(callRef(), onCallDoc));
      createPeer(); /* نجهّز الاتصال مبكراً حتى يبدأ بسرعة عند الرد */
      CallTones.ringback();
      RTC.ringT = setTimeout(function(){
        if(!RTC.connected && !RTC.offerStarted) finalizeCall('missed', false, 'لم يرد');
      }, CALL_CFG.ringTimeout);
    });
  }).catch(function(e){
    if(RTC.callId !== myId) return;
    var denied = e && (e.code === 'permission-denied' || /permission/i.test(String(e.message || '')));
    toast(denied ? '⚠️ المكالمات تحتاج تحديث قواعد Firestore (ملف firestore.rules)' : mediaErrMsg(e));
    finalizeCall('canceled', false, '', true);
  });
}

function handleIncomingCall(callId, d){
  var ref = window.fbGetDocRef('calls', callId);
  if(S.blocked && S.blocked.indexOf(d.caller) > -1){ window.fbUpdateDoc(ref, { status: 'rejected' }).catch(function(){}); return; }
  if(RTC.callId){ window.fbUpdateDoc(ref, { status: 'busy' }).catch(function(){}); return; }
  resetRTC();
  RTC.callId = callId; RTC.isCaller = false; RTC.polite = true; RTC.peerEmail = d.caller;
  RTC.type = d.type === 'video' ? 'video' : 'audio';
  RTC.speakerOn = RTC.type === 'video';
  renderCallUI();
  setCallStatus(RTC.type === 'video' ? 'مكالمة فيديو واردة...' : 'مكالمة صوتية واردة...');
  CallTones.ring();
  try{
    if(document.hidden && window.Notification && Notification.permission === 'granted'){
      new Notification('مسبار المدرسة', { body: (d.callerName || 'مكالمة واردة') + ' يتصل بك' });
    }
  }catch(e){}
  window.fbUpdateDoc(ref, { status: 'ringing' }).catch(function(){});
  RTC.unsubs.push(window.fbOnSnapshot(ref, onCallDoc));
  prefetchIce().then(function(){ if(RTC.callId === callId && !RTC.pc && !RTC.finishing) createPeer(); });
  RTC.ringT = setTimeout(function(){ if(!RTC.answered) finalizeCall('missed', false, 'مكالمة فائتة'); }, CALL_CFG.ringTimeout + 8000);
}

function answerCall(){
  if(!RTC.callId || RTC.isCaller || RTC.answered) return;
  var myId = RTC.callId;
  RTC.answered = true;
  clearTimeout(RTC.ringT);
  CallTones.stop();
  var inc = document.getElementById('incomingControls'); if(inc) inc.style.display = 'none';
  var pan = document.getElementById('callControlPanel'); if(pan) pan.style.display = 'flex';
  setCallStatus('جاري الاتصال...');
  Promise.all([getCallMedia(RTC.type === 'video'), prefetchIce()]).then(function(r){
    var stream = r[0];
    if(RTC.callId !== myId){ stopStream(stream); return; }
    RTC.local = stream;
    RTC.camOn = stream.getVideoTracks().length > 0;
    attachLocal(); updateCallButtons();
    if(!RTC.pc) createPeer();
    return window.fbUpdateDoc(callRef(), { status: 'accepted', answeredAt: Date.now() }).then(function(){
      RTC.connT = setTimeout(function(){
        if(!RTC.connected) finalizeCall('ended', false, connectFailReason());
      }, CALL_CFG.connectTimeout + 5000);
    });
  }).catch(function(e){
    if(RTC.callId !== myId) return;
    toast(mediaErrMsg(e));
    finalizeCall('rejected', false, '');
  });
}

/* زر الإنهاء/الرفض من المستخدم */
function endCall(){
  if(!RTC.callId) return;
  var st;
  if(RTC.connected) st = 'ended';
  else if(RTC.isCaller) st = RTC.offerStarted ? 'ended' : 'canceled';
  else st = RTC.answered ? 'ended' : 'rejected';
  finalizeCall(st, false, '');
}

/* الإنهاء الموحّد: يغلق كل شيء ويكتب سجل المكالمة بالمحادثة */
function finalizeCall(status, remote, msg, silent){
  if(!RTC.callId || RTC.finishing) return;
  RTC.finishing = true;
  var wasConnected = RTC.connected, wasCaller = RTC.isCaller, peer = RTC.peerEmail, cType = RTC.type;
  var sTime = RTC.startTime, cId = RTC.callId, ref = window.fbGetDocRef('calls', cId);
  ['ringT', 'connT', 'reconT', 'failT'].forEach(function(k){ clearTimeout(RTC[k]); });
  if(RTC.timer){ clearInterval(RTC.timer); RTC.timer = null; }
  CallTones.stop();
  if(!silent && (wasConnected || msg)) CallTones.ended();

  RTC.unsubs.forEach(function(f){ try{ f(); }catch(e){} }); RTC.unsubs = [];
  if(!remote) window.fbUpdateDoc(ref, { status: status, endedAt: Date.now() }).catch(function(){});

  var pc = RTC.pc, local = RTC.local, wake = RTC.wake;
  RTC.pc = null; RTC.local = null;
  try{ if(pc){ pc.ontrack = null; pc.onicecandidate = null; pc.oniceconnectionstatechange = null; pc.close(); } }catch(e){}
  stopStream(local);
  try{ if(wake) wake.release(); }catch(e){}
  var ra = document.getElementById('remoteAudio'); if(ra) ra.srcObject = null;

  /* سجل المكالمة في المحادثة (يكتبه المتصل فقط) */
  if(wasCaller && peer && !silent){
    var dmId = 'dm_' + [S.email, peer].sort().join('__');
    var c = S.cv.find(function(x){ return x.id === dmId; });
    if(!c){
      c = { id: dmId, n: peer.split('@')[0], peerEmail: peer, photo: '', g: 0, members: [S.email, peer], msgs: [], updatedAt: Date.now() };
      S.cv.unshift(c);
    }
    var durTxt = '';
    if(wasConnected && sTime){
      var s = Math.floor((Date.now() - sTime) / 1000), m = Math.floor(s / 60), ss = s % 60;
      durTxt = m + ':' + (ss < 10 ? '0' + ss : ss);
    }
    var isFail = /^(تعذر|انقطع)/.test(msg || '');
    var reason = status === 'rejected' ? 'رفض المكالمة' : status === 'busy' ? 'الخط مشغول' : isFail ? msg : 'لم يرد عليها';
    var txt = (cType === 'video' ? '📹 مكالمة فيديو' : '📞 مكالمة صوتية') + (wasConnected ? ' (' + durTxt + ')' : ' (' + reason + ')');
    var msgObj = {
      id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), e: S.email,
      sender: S.dispName || S.email.split('@')[0], t: txt, isCall: true, callType: cType,
      missed: !wasConnected, reason: wasConnected ? '' : reason, dur: durTxt, at: Date.now()
    };
    c.msgs = c.msgs || []; c.msgs.push(msgObj);
    c.lastPreview = txt; c.updatedAt = msgObj.at; c.lastFrom = S.email;
    if(window.fbSendRoomMessage) window.fbSendRoomMessage(c, msgObj);
    saveAllUserStorage();
    if(S.curChatId === c.id) setTimeout(draw, 100);
  }

  var closeNow = function(){
    var mod = document.getElementById('callModal'); if(mod) mod.remove();
    if(RTC.callId === cId) resetRTC();
  };
  if(msg && !silent){
    var el = document.getElementById('callStatus'); if(el) el.textContent = msg;
    var sheet = document.getElementById('callSheet'); if(sheet) sheet.remove();
    setTimeout(closeNow, /^(تعذر|انقطع)/.test(msg) ? 3800 : 1300);
  } else closeNow();
}

function toggleMute(){
  if(!RTC.local) return;

/* مخارج الصوت: مكبر الصوت (speaker) وسماعة الأذن (earpiece) */
var SINK = { speaker: null, earpiece: null, scanned: false };
function scanOutputs(){
  var ra = document.getElementById('remoteAudio');
  if(!ra || typeof ra.setSinkId !== 'function' || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve();
  return navigator.mediaDevices.enumerateDevices().then(function(devs){
    var outs = devs.filter(function(d){ return d.kind === 'audiooutput'; });
    var pick = function(re){ for(var i = 0; i < outs.length; i++){ if(re.test(outs[i].label || '')) return outs[i].deviceId; } return null; };
    SINK.speaker = pick(/speaker(?!.*(ear|phone call))|loud|مكبر/i) || pick(/speakerphone/i);
    SINK.earpiece = pick(/earpiece|receiver|handset|telephone|سماعة الأذن/i);
    /* على الحاسوب: جهاز "communications" هو سماعة الاتصال */
    if(!SINK.earpiece && !SINK.speaker){
      var comm = outs.filter(function(d){ return d.deviceId === 'communications'; })[0], def = outs.filter(function(d){ return d.deviceId === 'default'; })[0];
      if(comm && def && comm.groupId !== def.groupId){ SINK.earpiece = comm.deviceId; SINK.speaker = def.deviceId; }
    }
    SINK.scanned = true;
  }).catch(function(){});
}
function applyAudioRoute(){
  var ra = document.getElementById('remoteAudio'); if(!ra) return;
  ra.muted = false;
  if(SINK.speaker && SINK.earpiece){
    ra.volume = 1;
    ra.setSinkId(RTC.speakerOn ? SINK.speaker : SINK.earpiece).catch(function(e){ console.log('setSinkId error', e); });
    RTC.routeSoft = false;
  } else {
    /* الجهاز/المتصفح لا يسمح بالتبديل الحقيقي: نخفض الصوت ليصير خاصاً */
    ra.volume = RTC.speakerOn ? 1 : 0.22;
    RTC.routeSoft = true;
  }
}
function toggleSpeaker(){
  RTC.speakerOn = !RTC.speakerOn;
  applyAudioRoute();
  updateCallButtons();
  if(RTC.speakerOn) toast('🔊 مكبر الصوت');
  else toast(RTC.routeSoft ? '📞 وضع سماعة الأذن (تم خفض الصوت، هذا الجهاز لا يسمح بتحويل المخرج)' : '📞 سماعة الأذن');
}

function toggleVideo(){ setCamera(!RTC.camOn); }

function setCamera(on){
  if(!RTC.local || RTC.camBusy) return Promise.resolve();
  RTC.camBusy = true;
  var done = function(){ RTC.camBusy = false; attachLocal(); updateCallButtons(); sendCallState(); };
  if(!on){
    RTC.local.getVideoTracks().forEach(function(t){ t.stop(); RTC.local.removeTrack(t); });
    RTC.camOn = false;
    var tr = videoTransceiver();
    var p = (tr && tr.sender) ? tr.sender.replaceTrack(null).catch(function(){}) : Promise.resolve();
    return p.then(done);
  }
  return navigator.mediaDevices.getUserMedia({ video: callVideoConstraints() }).then(function(s){
    var t = s.getVideoTracks()[0];
    RTC.local.addTrack(t);
    RTC.camOn = true;
    if(!RTC.speakerOn){ RTC.speakerOn = true; applyAudioRoute(); }
    var tr = videoTransceiver();
    if(tr && tr.sender){
      return tr.sender.replaceTrack(t).then(function(){
        if(tr.direction === 'recvonly' || tr.direction === 'inactive') tr.direction = 'sendrecv';
      });
    }
    if(RTC.pc) RTC.pc.addTrack(t, RTC.local);
  }).catch(function(e){ toast(mediaErrMsg(e)); }).then(done);
}

function flipCamera(){
  if(!RTC.local || !RTC.camOn || RTC.camBusy) return;
  RTC.camBusy = true;
  var old = RTC.facing;
  RTC.facing = old === 'user' ? 'environment' : 'user';
  RTC.local.getVideoTracks().forEach(function(t){ t.stop(); RTC.local.removeTrack(t); });
  navigator.mediaDevices.getUserMedia({ video: callVideoConstraints() }).then(function(s){
    var t = s.getVideoTracks()[0];
    RTC.local.addTrack(t);
    var tr = videoTransceiver();
    if(tr && tr.sender) return tr.sender.replaceTrack(t);
  }).catch(function(){
    RTC.facing = old; RTC.camOn = false;
    var tr = videoTransceiver(); if(tr && tr.sender) tr.sender.replaceTrack(null).catch(function(){});
    toast('تعذر قلب الكاميرا');
  }).then(function(){ RTC.camBusy = false; attachLocal(); updateCallButtons(); sendCallState(); });
}

function pickCallOutput(){
  var ra = document.getElementById('remoteAudio');
  if(!ra || !navigator.mediaDevices.enumerateDevices) return;
  navigator.mediaDevices.enumerateDevices().then(function(devs){
    var outs = devs.filter(function(x){ return x.kind === 'audiooutput'; });

      }
      sh.remove();
    });
    modal.appendChild(sh);
  });
}

function showCallInfo(){
  if(!RTC.pc){ toast('الاتصال لم يبدأ بعد'); return; }
  RTC.pc.getStats().then(function(stats){
    var pair = null, locals = {};
    stats.forEach(function(r){
      if(r.type === 'local-candidate') locals[r.id] = r;
      if(r.type === 'candidate-pair' && (r.nominated || r.selected) && r.state === 'succeeded') pair = r;
    });
    if(!pair){ toast('لم يكتمل الاتصال بعد'); return; }
    var rtt = pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null;
    var lc = locals[pair.localCandidateId];
    var route = lc && lc.candidateType === 'relay' ? 'عبر سيرفر وسيط' : 'اتصال مباشر';
    var q = rtt == null ? '' : (rtt < 150 ? 'ممتازة' : rtt < 350 ? 'جيدة' : 'ضعيفة');
    toast((q ? 'الجودة: ' + q + ' · ' : '') + (rtt != null ? 'التأخير ' + rtt + 'ms · ' : '') + route);
  }).catch(function(){ toast('تعذر قراءة معلومات الاتصال'); });
}

async function callAIText(prov, messages, sys){
  var key=provKey(prov);if(!key)throw new Error("NOKEY");
  var want=S.aiWeb===true,errs=[],last=0,models=AI_PROVS[prov].models;

  var run=async function(web,sx){
    for(var i=0;i<models.length;i++){
      try{var r=await aiOnce(prov,key,models[i],messages,sx,web);if(r.txt)return r}
      catch(e){last=e.status||0;errs.push(e.message);if(e.status===401||e.status===403||!navigator.onLine)throw e}
    }
    return null;
  };
  try{
    if(want){
      var r=await run(true,sys);if(r){S.aiLast={mode:"native",src:r.src};return r.txt}
      var why=errs[errs.length-1]||"";

  }catch(e){last=e.status||last;errs.push(e.message)}
  var m=errs[errs.length-1]||"",f=aiErr(last,m),raw=String(m).slice(0,180);

  if(src==="mat"&&!corpus().length){toast("ما عندك ملازم محفوظة للبحث فيها — ضيف ملزمة أو جرّب الذكاء");return}
  if(!gate())return;
  var hist=chatOf(p);hist.push([v,1]);S.ai=hist;S.busy=true;S.liveTxt="";
  S.stage=src==="web"?"🔎 أبحث في الإنترنت…":(src==="mat"?"📄 أبحث في ملازمك…":"⏳ يفكر…");draw();
  var scroll=function(){var b=$("aiBox");if(b)b.scrollTop=b.scrollHeight};scroll();
  var prefix="",live=function(t){S.liveTxt=prefix+t;var e=$("aiLive");if(e){e.textContent=S.liveTxt;scroll()}};
  try{
    var msgs=hist.slice(-12).map(function(m){return {role:m[1]?"user":"assistant",content:m[0]}});
    while(msgs.length&&msgs[0].role!=="user")msgs.shift();
    if(src==="mat"){
      var res=matSearch(v);prefix=matBlock(res)+"\n\n";live("");
      if(!res.length){hist.push([prefix.trim(),0]);S.busy=false;S.liveTxt="";draw();scroll();return}
      msgs[msgs.length-1]={role:"user",content:"أجب عن السؤال اعتماداً على المقاطع التالية من ملازم الطالب فقط، وإن لم تكفِ فقل ذلك:\n\n"+res.map(function(r,i){return (i+1)+") ["+r.t+"] "+r.c}).join("\n\n")+"\n\nالسؤال: "+v};
      prefix+="🧠 جواب الذكاء:\n";
    }
    var ans=await askAI(p,msgs,AI_SYS,src==="web",live);
    hist.push([prefix+(ans||"(لا يوجد رد)")+(src==="web"?aiTag():""),0]);
  }catch(e){
    hist.push(["⚠️ "+(e.message==="NOKEY"?"اربط المفتاح أولاً":e.message),0]);
  }
  S.aiWeb=false;S.busy=false;S.liveTxt="";draw();scroll();
}

// Global state for Batch OMR
var OMR = {
  ansModel: "",
  curStudentPages: []
};

function startBatchAIOmr(){
  if(!gate("للتصحيح الآلي اللامحدود، يرجى الاشتراك بالباقة المدفوعة.")) return;
  if(!aiReady()){ refundTry(); toast("يرجى ربط حساب Gemini من تبويب الذكاء الاصطناعي للقيام بالتصحيح."); return; }
  
  if(!OMR.ansModel){
    ask("اكتب الإجابة النموذجية والدرجة القصوى (مثال: الحل النموذجي هو كذا.. من 10):", function(ans){
       if(ans){ OMR.ansModel = ans; OMR.curStudentPages = []; openOmrCamera(); }
    });
  } else {
    OMR.curStudentPages = [];
    openOmrCamera();
  }
}

function openOmrCamera(){
  var f = document.createElement("input");
  f.type = "file"; f.accept = "image/*,application/pdf"; f.multiple = true; 
  f.setAttribute("capture", "environment");
  f.onchange = async function(){
     var files = Array.from(f.files);
     if(!files.length) return;
     
     var hasPdf = files.some(file => file.type === "application/pdf");
     if(hasPdf){
        toast("⏳ جاري قراءة ملف الـ PDF الجامعي...");
        // In a real full-scale PDF parser we'd extract images using pdf.js, 
        // For now, we will send the PDF file directly to Gemini API if the user's key supports it.
        // Or instruct the user that PDF processing requires the API key.
        var pdfFile = files.find(file => file.type === "application/pdf");
        var reader = new FileReader();
        reader.onload = async function(){
           S.busy = true; S.omrResult = "⏳ جاري تحليل ملف الـ PDF الامتحاني بالذكاء الاصطناعي..."; draw();
           try{
              var base64Data = reader.result.split(',')[1];
              var prompt = "أنت أستاذ جامعي تصحح دفتر امتحاني بصيغة PDF. الإجابة النموذجية هي: [" + OMR.ansModel + "]. اقرأ الدفتر الامتحاني بدقة. 1. استخرج اسم الطالب بوضوح. 2. قيّم الإجابة وأعطه درجة نهائية (رقم فقط). 3. اكتب تعليقاً يبرر الدرجة. أعد النتيجة بصيغة JSON فقط: {\"name\":\"اسم الطالب\",\"score\":الدرجة,\"feedback\":\"التعليق\"}";
              
              var body = { contents: [{ role: "user", parts: [ { text: prompt }, { inlineData: { mimeType: "application/pdf", data: base64Data } } ] }], generationConfig: { temperature: 0.65, responseMimeType: "application/json" } };
              var res = await gGenRaw(body);
              var data = await res.json();
              
              if(res.ok && data.candidates && data.candidates[0].content){
                 var txt = data.candidates[0].content.parts.map(p => p.text || "").join("");
                 var obj = JSON.parse(txt);
                 var sName = obj.name || "طالب غير معروف";
                 var sScore = Number(obj.score) || 0;
                 
                 S.omrResult = "🧑‍🎓 اسم الطالب: " + sName + "\n💯 الدرجة: " + sScore + "\n📝 التقييم: " + (obj.feedback||"");
                 S.gr = S.gr || [];
                 S.gr.push([sName, sScore]);
                 saveAllUserStorage();
                 toast("✅ تم تصحيح الدفتر وإضافة الدرجة بنجاح!");
              } else {
                 S.omrResult = "تعذر تحليل الـ PDF: " + (data.error ? data.error.message : "خطأ غير معروف");
              }
           }catch(e){ S.omrResult = "خطأ: " + e.message; }
           S.busy = false; draw();
        };
        reader.readAsDataURL(pdfFile);
        return;
     }
     
     toast("⏳ جاري تحميل " + files.length + " صفحة...");
     var readPromises = files.map(file => new Promise((resolve) => {
        var r = new FileReader();
        r.onload = function(){ resolve(r.result); };
        r.readAsDataURL(file);
     }));
     
     Promise.all(readPromises).then(results => {
        OMR.curStudentPages = OMR.curStudentPages.concat(results);
        showOmrStudentReview();
     });
  };
  f.click();
}

async function submitOmrStudent(){
  var md = document.getElementById("md"); if(md) md.remove();
  if(!OMR.curStudentPages.length) return;
  
  S.busy = true; S.omrResult = "⏳ جاري استخراج اسم الطالب وتقييم الإجابات المدمجة..."; draw();
  try{
    // If multiple pages, we send them to Gemini in one prompt (Gemini 1.5 Flash handles multiple images well)
    var parts = [{ text: "أنت أستاذ تصحح ورقة امتحانية مكوّنة من " + OMR.curStudentPages.length + " صفحات لطالب واحد. الإجابة النموذجية التي وضعها الأستاذ هي: [" + OMR.ansModel + "]. اقرأ جميع الصفحات المرفقة بتركيز. 1. استخرج اسم الطالب بوضوح. 2. قيّم الإجابة المدمجة وأعطه درجة نهائية (رقم فقط). 3. اكتب تعليقاً يبرر الدرجة. أعد النتيجة بصيغة JSON فقط: {\"name\":\"اسم الطالب\",\"score\":الدرجة,\"feedback\":\"التعليق\"}" }];
    
    OMR.curStudentPages.forEach(src => {
        var sp = src.split("base64,");
        var mime = sp[0].replace("data:","").replace(";","") || "image/jpeg";
        parts.push({inlineData: {mimeType: mime, data: sp[1]}});
    });
    
    var body = { contents: [{ role: "user", parts: parts }], generationConfig: { temperature: 0.65, responseMimeType: "application/json" } };
    var res = await gGenRaw(body);
    var data = await res.json();
    
    if(res.ok && data.candidates && data.candidates[0].content){
       var txt = data.candidates[0].content.parts.map(p => p.text || "").join("");
       var obj = JSON.parse(txt);
       var sName = obj.name || "طالب غير معروف";
       var sScore = Number(obj.score) || 0;
       
       S.omrResult = "🧑‍🎓 اسم الطالب: " + sName + "\n💯 الدرجة: " + sScore + "\n📝 التقييم: " + (obj.feedback||"");
       S.gr = S.gr || [];
       S.gr.push([sName, sScore]);
       saveAllUserStorage();
       toast("✅ تمت إضافة " + sName + " بنجاح!");
       
       // Prompt to continue with next student
       setTimeout(() => {
          askOmrNextStudent();
       }, 800);
       
    } else {
       S.omrResult = "تعذر تحليل الورقة: " + (data.error ? data.error.message : "مجهول");
    }
  }catch(e){ S.omrResult = "خطأ: " + e.message; }
  
  S.busy = false; draw();
}

function hashCode(s){
  var h = 0; for(var i=0; i<s.length; i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
  return String(Math.abs(h)).slice(0,5).padStart(5,"1");
}

function buildRandomStudentPackage(quiz){
  var rawBank = (quiz.bank && quiz.bank.length) ? JSON.parse(JSON.stringify(quiz.bank)) : [{ q: quiz.q, opts: quiz.opts, ans: 0 }];
  var count = Math.max(1, Math.min(quiz.perStu || rawBank.length, rawBank.length));
  if(quiz.shuffle){
    for(var i = rawBank.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = rawBank[i]; rawBank[i] = rawBank[j]; rawBank[j] = tmp;
    }
  }
  var picked = rawBank.slice(0, count).map(function(item){
    var indexedOpts = (item.opts || []).map(function(txt, idx){ return { txt: txt, isCorrect: idx === (item.ans || 0) }; });
    if(quiz.shuffle){
      for(var k = indexedOpts.length - 1; k > 0; k--){
        var r = Math.floor(Math.random() * (k + 1));
        var t = indexedOpts[k]; indexedOpts[k] = indexedOpts[r]; indexedOpts[r] = t;
      }
    }
    var newAns = indexedOpts.findIndex(function(o){ return o.isCorrect; });
    return { q: item.q, opts: indexedOpts.map(function(o){ return o.txt; }), ans: newAns >= 0 ? newAns : 0, chosen: -1 };
  });
  return picked;
}

function normNm(s){ return String(s||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim(); }
function rosterList(){
  if(S.rosterTxt === undefined){ try{ S.rosterTxt = localStorage.getItem("misbar_roster_" + (S.uid||"anon")) || ""; }catch(e){ S.rosterTxt = ""; } }
  return String(S.rosterTxt).split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
}
function presentSet(){
  var s = {};
  /* v2.70: الحضور من آخر امتحان مباشر. الدفتر يُحتسب فقط إذا فعّل الأستاذ خيار "امتحان ورقي" (حتى لا تُحسب درجات قديمة حضوراً) */
  Object.keys(S.liveQuizAnswers || {}).forEach(function(k){ var a = S.liveQuizAnswers[k]; if(a && a.name) s[normNm(a.name)] = 1; });
  if(S.absUseGr){ (S.gr || []).forEach(function(g){ s[normNm(String(g[0]).replace(/ \(معدل.*\)/g,""))] = 1; }); }
  return s;
}
function absentList(){ var p = presentSet(); return rosterList().filter(function(n){ return !p[normNm(n)]; }); }
function saveRoster(v){ S.rosterTxt = v; S.absSkip = {}; try{ localStorage.setItem("misbar_roster_" + (S.uid||"anon"), v); }catch(e){} }
function absSkipSet(i,on){ var n = absentList()[i]; if(n){ S.absSkip = S.absSkip || {}; S.absSkip[normNm(n)] = !on; } }
function absSubjCur(){ return String((S.absSubjVal || ($("absSubj") ? $("absSubj").value : "") || "")).trim(); }
function absSubjHash(sj){ return cyr(normNm(sj) || "-", 3)[0].toString(36); }
function absDayKey(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function absSentKey(){ var kp = keyParts(); return "misbar_abs_sent_" + (S.uid||"anon") + "_" + (kp ? kp.id : "local") + "_" + absDayKey() + "_" + absSubjHash(absSubjCur()); }
function absSentMap(){ try{ return JSON.parse(localStorage.getItem(absSentKey()) || "{}"); }catch(e){ return {}; } }
function absSentMark(names){ var m = absSentMap(), t = Date.now(); names.forEach(function(n){ m[normNm(n)] = t; }); try{ localStorage.setItem(absSentKey(), JSON.stringify(m)); }catch(e){} }

      '<button class="b" style="width:100%;background:#dc2626" ' + (S.busy ? 'disabled' : '') + ' onclick="sendAbsence()">📤 تبليغ الغياب تلقائياً للأهالي والإدارة</button>' : '') +
  '</div>';

function sendAbsence(){
  if(S.busy){ toast("جاري الإرسال، انتظر..."); return; }
  var subj = absSubjCur();
  var cand = absentList().filter(function(n){ return !S.absSkip[normNm(n)]; });
  if(!cand.length){ toast("ما كو غياب للإرسال"); return; }
  if(!requireKey()) return;
  if(!window.fbPutCardItemId || !window.fbCardItemExists || !window.fbSendReport){ toast("قاعدة البيانات غير جاهزة"); return; }
  var local = absSentMap(), todo = [], unmatched = 0;
  cand.forEach(function(n){
    if(local[normNm(n)]) return;
    var c = stuCode(n); if(!c) return;
    if(S.instRosterMap && !S.instRosterMap[normNm(n)]) unmatched++;
    todo.push({ n: n, c: c });
  });
  if(!todo.length){ toast("كل الغائبين بُلِّغ عنهم اليوم لنفس المادة"); return; }
  var tName = S.dispName || S.email, now = Date.now(), d = new Date(now).toLocaleDateString("ar-IQ");
  var id = "abs_" + absDayKey() + "_" + absSubjHash(subj) + "_" + (S.uid || "anon");
  var sentNow = [], already = [], failed = [], lastErr = "";
  S.busy = true; draw();
  Promise.all(todo.map(function(t, i){
    /* معرّف ثابت (يوم+مادة+أستاذ): أي جهاز ثاني يلقى التبليغ موجود فلا يكرره */
    return window.fbCardItemExists(t.c, id).then(function(ex){
      if(ex){ already.push(t); return; }
      return window.fbPutCardItemId(t.c, id, { student: t.n, teacher: tName, teacherEmail: S.email, type: "absent", subject: subj, inst: keyParts().id, tuid: S.uid, note: "غاب الطالب" + (subj ? " عن " + subj : "") + " بتاريخ " + d, at: now + i }).then(function(){ sentNow.push(t); });
    }).catch(function(e){ failed.push(t); lastErr = (e && (e.code || e.message)) || String(e); });
  })).then(function(){
    if(!sentNow.length) return;
    return window.fbSendReport(keyParts().id, { teacher: tName, email: S.email, at: now, kind: "absence", subject: subj, grades: [], absent: sentNow.map(function(t){ return [t.n, t.c]; }), rosterCount: rosterList().length });
  }).then(function(){
    absSentMark(sentNow.concat(already).map(function(t){ return t.n; }));
    S.busy = false; draw();
    var m = [];
    if(sentNow.length) m.push("✅ تم تبليغ غياب " + sentNow.length + " طالب للأهالي والإدارة");
    if(already.length) m.push(already.length + " مبلَّغ عنهم سابقاً");
    if(failed.length) m.push("⚠️ فشل " + failed.length + " (" + lastErr + ") — أعد المحاولة");
    if(unmatched) m.push("⚠️ " + unmatched + " اسم غير مطابق لسجل الإدارة (ما يوصل لأهلهم)");
    toast(m.join(" · "));
  }).catch(function(e){
    /* فشل إرسال تقرير الإدارة: التبليغات للأهالي وصلت، فنسجّلها حتى لا تتكرر */
    absSentMark(sentNow.concat(already).map(function(t){ return t.n; }));
    S.busy = false; draw(); toast("وصل الأهالي لكن تعذر تقرير الإدارة: " + (e && e.message || e));
  });
}

      var d = ch.doc.data();
      if(Math.abs(Date.now() - (d.at || 0)) < 90000 && typeof handleIncomingCall === "function"){
        handleIncomingCall(ch.doc.id, d);
      }
    });
  },function(e){
    console.log("calls listener error", e && e.code);
    if(e && e.code === "permission-denied" && !S._callPd){ S._callPd = 1; toast("⚠️ المكالمات تحتاج تحديث قواعد Firestore (ملف firestore.rules)"); }
  }));

  var msgUnsub = null, watchedChatId = null;
  var chatFail=function(e){
    var c=e&&e.code;
    if(c==="permission-denied"){
      if(!S._pdToast){S._pdToast=1;toast("⚠️ قواعد Firebase تمنع المحادثات، حدّث Firestore Rules (ملف firestore.rules)");}
    }else toast("تعذر الإرسال: "+(c||e));
  };

  window.fbWatchRoomMessages = function(chatId){
    if(!chatId || chatId === "local_notes" || chatId === watchedChatId) return;
    if(msgUnsub){ try{msgUnsub()}catch(e){} msgUnsub = null; }
    watchedChatId = chatId;
    msgUnsub = onSnapshot(collection(db,"chats",chatId,"messages"),function(msSnap){
      var arr=[];
      msSnap.forEach(function(md){ var m=md.data(); m._pend=md.metadata.hasPendingWrites; arr.push(m); });
      arr.sort(function(a,b){ return (a.at||0)-(b.at||0); });
      var room = S.cv.find(function(x){ return x.id === chatId; });
      if(room && arr.length){
        room.msgs = arr;
        if(room.lastFrom && room.lastFrom !== S.email){
           room.readBy = room.readBy || {};
           if(!room.readBy[S.email] || room.readBy[S.email] < room.updatedAt){
             room.readBy[S.email] = Date.now();
             if(window.fbUpdateChatFields) window.fbUpdateChatFields(chatId, { readBy: room.readBy });
           }
        }
        drawSoon();
        setTimeout(function(){ var wb=$("waBody"); if(wb) wb.scrollTop=wb.scrollHeight; }, 30);
      }
    },function(e){ watchedChatId=null; chatFail(e); });
    unsubs.push(msgUnsub);
  };

  /* المحادثات: نسمع فقط للغرف اللي إيميلي بقائمة أعضائها (يطلع عند الطرف الثاني فوراً) */
  var chatsFirst = true;
  unsubs.push(onSnapshot(query(collection(db,"chats"),where("members","array-contains",S.email)),function(s){
    var prev = {};
    S.cv.forEach(function(c){ if(c && c.id) prev[c.id] = c; });
    var remote=[], ids={};
    s.forEach(function(d){
      var x=d.data(); x.id=d.id;
      var hid = (S.hiddenChats || {})[d.id];
      if(hid){ if((x.updatedAt||0) <= hid) return; delete S.hiddenChats[d.id]; try{ localStorage.setItem(storagePrefix()+"hiddenChats", JSON.stringify(S.hiddenChats)); }catch(e){} }
      var old = prev[d.id];
      x.msgs = (old && Array.isArray(old.msgs)) ? old.msgs : [];
      remote.push(x); ids[d.id]=1;
    });
    /* إشعار داخل التطبيق عند وصول رسالة/محادثة جديدة من شخص ثاني */
    if(!chatsFirst){
      s.docChanges().forEach(function(ch){
        if(ch.type==="removed" || ch.doc.metadata.hasPendingWrites) return;
        var x=ch.doc.data(); x.id=ch.doc.id;
        var o=prev[x.id];
        if(o && (o.updatedAt||0)>=(x.updatedAt||0)) return;
        if(!x.lastFrom || x.lastFrom===S.email) return;
        if(!x.g && S.blocked && S.blocked.indexOf(x.lastFrom) > -1) return; // Ignore blocked users
        if(S.mutedChats && S.mutedChats[x.id]) return; // Ignore muted chats
        var senderTitle = chatTitle(x);
        var prevTxt = x.lastPreview || "رسالة جديدة";
        if(S.curChatId===x.id && S.tab===(S.role==="pro"?3:2)) return;
        
        // Mark delivered
        x.dlv = x.dlv || {};
        if(!x.dlv[S.email] || x.dlv[S.email] < x.updatedAt){
           x.dlv[S.email] = Date.now();
           if(window.fbUpdateChatFields) window.fbUpdateChatFields(x.id, { dlv: x.dlv });
        }
        
        toast("💬 "+senderTitle+": "+prevTxt);
        showBrowserNotification("مسبار المدرسة - " + senderTitle, prevTxt);
      });
    }
    chatsFirst=false;
    remote.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
    var notes=S.cv.filter(function(c){ return c.id==="local_notes" || (!c.id && !c.g && c.n==="ملاحظاتي السريعة"); });
    notes.forEach(function(c){ c.id="local_notes"; });
    if(!notes.length) notes=[{id:"local_notes",n:"ملاحظاتي السريعة",g:0,members:[],msgs:[]}];
    /* محادثات انصنعت محلياً ولم تنرفع للسيرفر: نرفعها مرة ثانية بدل ما تضيع */
    var localOnly=S.cv.filter(function(c){ return c.id && c.id!=="local_notes" && !ids[c.id]; });
    localOnly.forEach(function(c){ if(c.members && c.members.indexOf(S.email)>-1 && window.fbSaveChatRoom) window.fbSaveChatRoom(c); });
    S.cv=notes.concat(remote,localOnly);
    drawSoon();
  },function(e){ chatFail(e); }));

  
  window.fbUpdateChatFields = function(chatId, fields){
    if(chatId && chatId !== "local_notes"){
      updateDoc(doc(db,"chats",chatId), fields).catch(function(){});
    }
  };

  window.fbSaveChatRoom=function(chatObj){
    if(!chatObj||!chatObj.id||chatObj.id==="local_notes")return Promise.resolve();
    var members=(chatObj.members&&chatObj.members.length)?chatObj.members:[S.email];
    var meta={id:chatObj.id,n:chatObj.n||"",g:chatObj.g?1:0,members:arrayUnion.apply(null,members),photo:chatObj.photo||"",lastPreview:chatObj.lastPreview||"",lastFrom:chatObj.lastFrom||"",updatedAt:chatObj.updatedAt||Date.now()};
    return setDoc(doc(db,"chats",chatObj.id),meta,{merge:true});
  };
  
  window.fbDeleteChatEntirely = function(chatId) {
    if(chatId && chatId !== "local_notes") {
      deleteDoc(doc(db,"chats",chatId)).catch(function(){});
    }
  };
window.fbDeleteRoomMessage=function(chatId, msgId){
    if(chatId && chatId !== "local_notes" && msgId){
      deleteDoc(doc(db,"chats",chatId,"messages",msgId)).catch(function(){});
    }
  };
  window.fbSendRoomMessage=function(chatObj, msgObj){
    if(!chatObj||!chatObj.id||chatObj.id==="local_notes"||!msgObj||!msgObj.id)return;
    chatObj.lastFrom=msgObj.e;
    chatObj.updatedAt=msgObj.at||Date.now();
    chatObj.lastPreview=msgObj.file?("📎 "+msgObj.file.name):(msgObj.t||"");
    var clean=Object.assign({},msgObj);delete clean._pend;delete clean._fail;
    /* أولاً الغرفة (فيها قائمة الأعضاء) ثم الرسالة، حتى تقبلها القواعد */
    window.fbSaveChatRoom(chatObj).then(function(){
      return setDoc(doc(db,"chats",chatObj.id,"messages",msgObj.id),clean);
    }).catch(function(e){
      msgObj._fail=true;drawSoon();chatFail(e);
    });
  };
  window.fbSendFeedback=function(item){
    setDoc(doc(db,"feedbacks",item.id),item).catch(function(){});
  };
  window.fbAddPost=function(pObj){
    setDoc(doc(db,"posts",pObj.id),pObj).catch(function(){});
  };
  unsubs.push(onSnapshot(collection(db,"posts"),function(s){
    var a=[];s.forEach(function(d){a.push(d.data())});
    if(a.length){
      a.sort(function(x,y){return (y.at||0)-(x.at||0)});
      S.posts=a;drawSoon();
    }
  },function(){}));

  if(S.isOwner){
    unsubs.push(onSnapshot(collection(db,"feedbacks"),function(s){
      var a=[];s.forEach(function(d){a.push(d.data())});
      a.sort(function(x,y){return (y.at||0)-(x.at||0)});
      if(a.length) S.feedbacks=a;
      drawSoon();
    },function(){}));
    unsubs.push(onSnapshot(collection(db,"requests"),function(s){
      var a=[];s.forEach(function(d){var x=d.data();x.id=Number(d.id);a.push(x)});
      a.sort(function(x,y){return y.d-x.d});S.req=a;drawSoon();
    },err));
    unsubs.push(onSnapshot(collection(db,"subscriptions"),function(s){
      var a=[];s.forEach(function(d){var x=d.data();x.id=d.id;x.uid=x.uid||d.id;a.push(x)});
      S.subs=a;drawSoon();
    },err));
  }else{
    unsubs.push(onSnapshot(query(collection(db,"requests"),where("uid","==",u.uid)),function(s){
      var a=[];s.forEach(function(d){var x=d.data();x.id=Number(d.id);a.push(x)});
      a.sort(function(x,y){return y.d-x.d});S.req=a;drawSoon();
    },err));
    var sa=[],sb=[],mix=function(){S.subs=sa.concat(sb);drawSoon()};
    unsubs.push(onSnapshot(doc(db,"subscriptions",u.uid),function(s){
      sa=s.exists()?[{id:u.uid,uid:u.uid,e:S.email,n:s.data().n,s:s.data().s,end:s.data().end,a:s.data().a}]:[];mix();
    },err));
    unsubs.push(onSnapshot(query(collection(db,"subscriptions"),where("uid","==",u.uid)),function(s){
      sb=[];s.forEach(function(d){if(d.id!==u.uid){var x=d.data();x.id=d.id;x.e=S.email;sb.push(x)}});mix();
    },err));
  }
  drawSoon();
}
var _unAuth=null;
function bindAuth(){if(_unAuth){try{_unAuth()}catch(e){}}_unAuth=onAuthStateChanged(auth,onAuth)}
window.fbCurPortal=function(){return curPortal};
window.fbUsePortal=function(p){
  var k=PORTAL_APP[p]||p;
  if(!APPS[k])return;
  if(k===curPortal&&_unAuth){if(S.authReady)drawSoon();return}
  unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];
  [typeof _wi!=="undefined"&&_wi,typeof _wr!=="undefined"&&_wr,typeof _wc!=="undefined"&&_wc].forEach(function(f){try{if(f)f()}catch(e){}});
  curPortal=k;app=APPS[k];auth=AUTHS[k];db=DBS[k];
  S.authReady=false;S.uid=null;S.email="";S.role=null;S.isOwner=false;S.subs=[];S.req=[];S.watchingInsts=false;S.curInstId=null;S.myInsts=[];S.cardItems=[];S.rsPub=[];S._rsW=null;S.stuClasses=[];S._swc=null;S.stuLink=undefined;S.profLoaded=false;
  bindAuth();
};
S.portalUsers={};
PORTALS.forEach(function(p){onAuthStateChanged(AUTHS[p],function(u){S.portalUsers[p]=u?(u.email||""):"";if(S.authReady&&!S.sysRole)drawSoon()})});
(function(){var sp="";try{sp=localStorage.getItem("misbar_portal")||""}catch(e){}
  var PK=["admin","pro","stu","parent"];
  var _goDone=0,go=function(){if(_goDone)return;_goDone=1;
    if(PK.indexOf(sp)>-1){S.sysRole=S.loginRole=sp;window.fbUsePortal(sp)}else{S.authReady=true;drawSoon();bindAuth()}};
  Promise.all(PORTALS.map(function(p){return AUTHS[p].authStateReady()})).then(go).catch(go);
  setTimeout(go,4000);
})();

window.sendReq=function(){
  var p=S.plans[S.pick];if(!p){toast("اختر باقة أولاً");return}
  if(S.req.some(function(r){return r.pid==pid(p)&&r.st=="new"})){toast("لديك طلب معلق لهذه الباقة");return}
  var id=Date.now();
  setDoc(doc(db,"requests",String(id)),{uid:S.uid,e:S.email,pid:pid(p),n:String(p.n),p:Number(p.p)||0,v:Number(p.v)||1,u:p.u,a:p.a||["pro","stu"],d:id,st:"new"})
    .then(function(){S.pick=null;toast("أُرسل طلبك للمالك")}).catch(fail);
};
window.reqSt=function(id,st){updateDoc(doc(db,"requests",String(id)),{st:st}).catch(fail)};
function subOf(id){return S.subs.filter(function(s){return (s.id||s.uid)==id})[0]}
window.actv=function(id){
  var r=gr(id),el=$("sd"+id),v=el?el.value:"",now=Date.now(),cur=subOf(subDocId(r)),st=v?new Date(v+"T00:00:00").getTime():now;
  if(cur&&cur.end>now)st=cur.end;
  setDoc(doc(db,"subscriptions",subDocId(r)),{uid:r.uid,a:r.a||["pro","stu"],e:r.e,n:r.n,s:cur&&cur.end>now?cur.s:st,end:st+dd(r)*864e5})
    .then(function(){return updateDoc(doc(db,"requests",String(id)),{st:"act"})}).catch(fail);
};
window.extR=function(id){
  var r=gr(id),now=Date.now(),cur=subOf(subDocId(r)),base=cur&&cur.end>now?cur.end:now;
  setDoc(doc(db,"subscriptions",subDocId(r)),{uid:r.uid,a:r.a||["pro","stu"],e:r.e,n:r.n,s:cur&&cur.end>now?cur.s:now,end:base+dd(r)*864e5})
    .then(function(){toast("تم التمديد")}).catch(fail);
};
window.stopR=function(id){
  var r=gr(id);
  setDoc(doc(db,"subscriptions",subDocId(r)),{end:Date.now()},{merge:true})
    .then(function(){return updateDoc(doc(db,"requests",String(id)),{st:"no"})}).catch(fail);
};
window.savePlans=function(){
  var keep={};
  S.plans.forEach(function(p,i){
    keep[pid(p)]=1;
    setDoc(doc(db,"plans",pid(p)),{n:String(p.n),p:Number(p.p)||0,v:Number(p.v)||1,u:p.u,f:p.f||"",hide:!!p.hide,a:p.a||["pro","stu"],o:i}).catch(fail);
  });
  remotePlans.forEach(function(id){if(!keep[id])deleteDoc(doc(db,"plans",id)).catch(fail)});
  toast("تم حفظ الباقات ونشرها");
};
</script>
