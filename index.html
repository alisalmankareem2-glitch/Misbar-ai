<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسبار AI</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#14213d;--mu:#667085;--ln:#e4e7ee;--ac:#1d4ed8;--acs:#e3ebff;--gold:#c8962b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--sf:#18203a;--tx:#eef1fb;--mu:#98a2bd;--ln:#2a3354;--acs:#1e2b57}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;padding-bottom:76px}
.pro{--ac:#15803d;--acs:#dcf5e5}
@media (prefers-color-scheme:dark){.pro{--acs:#173826}}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hat{font-size:28px;cursor:pointer;user-select:none;background:none;border:0;padding:0}
main{padding:14px;max-width:680px;margin:auto}
h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}
.mu{color:var(--mu);font-size:13px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 13px;font:600 13px Cairo,sans-serif;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
button.s{background:var(--acs);color:var(--ac)}
button.d{background:#fee2e2;color:#b91c1c}
button.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:400 14px Cairo,sans-serif;margin:4px 0 8px}
label{font-size:13px;color:var(--mu);display:block}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;background:none;border:0;padding:8px 2px;font:600 11px Cairo,sans-serif;color:var(--mu);min-height:54px;cursor:pointer}
nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:19px}
.out{white-space:pre-wrap;line-height:1.9;background:var(--acs);border-radius:12px;padding:12px;font-size:14px}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:80%;background:var(--sf);border:1px solid var(--ln)}
.msg.me{background:var(--ac);color:#fff;margin-inline-start:auto;border-color:var(--ac)}
.hero{text-align:center;padding:36px 16px 10px}.hero .hat{font-size:64px}
.hero h1{font-size:28px;margin:6px 0}
.tog{width:50px;height:28px;border-radius:14px;background:var(--ln);border:0;position:relative;cursor:pointer;flex-shrink:0}
.tog.on{background:var(--ac)}.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on::after{inset-inline-start:25px}
.chip{padding:7px 11px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:600 12px Cairo,sans-serif;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.symbar{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.symbar button{padding:4px 8px;border-radius:7px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:600 13px Cairo,sans-serif;cursor:pointer;min-width:32px}
.subj-card{background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:.15s}
.subj-card:active{transform:scale(.97)}
.subj-ico{width:42px;height:42px;border-radius:12px;background:var(--acs);color:var(--ac);font:800 16px Cairo,sans-serif;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--acs);color:var(--ac)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:30}.mc{background:var(--sf);padding:16px;border-radius:14px;width:min(340px,92%)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:25;font-size:13px;text-align:center;max-width:90%}
/* A4 Sheet & Booklet Print Styles */
.sheet-wrap{overflow-x:auto;padding-bottom:8px}
.sheet{background:#fff;color:#000;padding:18px 20px;border-radius:6px;line-height:1.85;min-height:360px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.sheet hr{border:0;border-top:1px dashed #333;margin:9px 0}
.bk-page{background:#fff;color:#000;padding:20px 22px;border-radius:6px;line-height:1.85;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;page-break-after:always;break-after:page}
.bk-cover{min-height:520px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:28px 24px}
@media print{
  .noprint,header,nav,#fab,#toast{display:none!important}
  body{background:#fff;padding:0;margin:0}
  main{padding:0;max-width:none}
  .sheet-wrap{overflow:visible;padding:0}
  .sheet,.bk-page{border-radius:0;box-shadow:none;margin:0;min-height:275mm}
  @page{size:A4;margin:10mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hero"><div class="hat">🎓</div><h1>مسبار AI</h1><p class="mu">جاري تهيئة الجلسة...</p></div>
</div>
<div id="toast"></div>

<script>
var S={
  authReady:false,uid:null,email:"",isOwner:false,
  role:null,tab:0,taps:0,code:"1234",
  bag:[{n:"محاضرات الفصل الأول",f:["المحاضرة 1.pdf","المحاضرة 2.docx"]},{n:"الاختبارات",f:["اختبار تجريبي.pdf"]}],
  classes:[{n:"الأحياء - الصف الخامس",c:"AB12",h:["المحاضرة 1.pdf","المحاضرة 2.docx"]}],
  joined:["AB12"],open:null,out:"",
  price:{m:5000,y:45000},trial:7,
  users:[{n:"زينب أحمد",on:true},{n:"د. حسن علي",on:true},{n:"مصطفى كريم",on:false}],
  chat:[["من يحتاج ملزمة الأسبوع القادم؟",0],["أنا يا أستاذ",1]],
  posts:[["د. حسن علي","ملزمة جديدة عن الخلية متاحة بالكلاس"],["زينب أحمد","هل أحد عنده ملخص الفصل الثاني؟"]],
  tx:"",pend:"",cd:"",gr:[["زينب أحمد",18],["مصطفى كريم",15]],
  bank:[],bi:"",bt:"",ai:[],free:5,prov:"Claude",
  plans:[{n:"أسبوعي",p:2000,v:1,u:"أسبوع"},{n:"شهري",p:5000,v:1,u:"شهر"},{n:"6 أشهر",p:25000,v:6,u:"شهر"},{n:"سنوي",p:45000,v:12,u:"شهر"}],
  codes:[],subs:[],req:[],rt:0,rs:"new",rq:"",pick:null,subv:0,
  fl:[{n:"ملفاتي",it:[]}],fo:0,use:{},
  cv:[{n:"د. حسن علي",g:0,m:[["د. حسن علي","أهلاً، وصلت الملزمة؟","",""],["أنا","نعم وصلت، شكراً","",""]]},{n:"كروب الأحياء - الخامس",g:1,m:[["زينب أحمد","متى الاختبار؟","",""]]}],cur:null,
  /* بوابة الأوراق والملازم (س1 المتكامل) */
  gw:null, // {view:'step1'|'step2'|'step3'|'ed_q'|'ed_b', kind:'q'|'b', subj:'عربي'}
  pp:null, // محرر ورقة الأسئلة
  bk:null, // محرر الملزمة
  docs:[]  // المستندات المحفوظة
};

try{S.docs=JSON.parse(localStorage.getItem("misbar_docs_v1")||"[]")}catch(e){S.docs=[]}
function saveDocsLocal(){try{localStorage.setItem("misbar_docs_v1",JSON.stringify(S.docs))}catch(e){toast("المساحة المحلية ممتلئة")}}

var $=function(i){return document.getElementById(i)},tmr;
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(tmr);tmr=setTimeout(function(){e.style.display="none"},2200)}
function ask(l,cb,pw){var d=document.createElement("div");d.id="md";d.innerHTML='<div class="mc"><b>'+l+'</b><input id="mi" '+(pw?'type="password" inputmode="numeric" ':'')+'><div class="row"><button class="b grow" id="mk">موافق</button><button class="b s grow" id="mx">إلغاء</button></div></div>';document.body.appendChild(d);var i=$("mi");i.focus();function c(){d.remove()}$("mx").onclick=c;$("mk").onclick=function(){var v=i.value.trim();c();if(v)cb(v)};i.onkeydown=function(e){if(e.key=="Enter")$("mk").click()}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

Object.defineProperty(S,"used",{get:function(){return S.use[S.email+"|"+new Date().toDateString()]||0},set:function(v){S.use[S.email+"|"+new Date().toDateString()]=v}});
function dd(p){return p.v*(p.u=="أسبوع"?7:p.u=="شهر"?30:1)}
function fd(t){return new Date(t).toLocaleDateString("ar-IQ")}
function pid(p){if(!p.id)p.id=Math.random().toString(36).slice(2,8);return p.id}
function isSub(){var n=Date.now();return S.subs.some(function(s){return s.e==S.email&&s.end>n&&(!s.s||s.s<=n)})}
function stat(){return S.email?(isSub()?"💳 مشترك":"💳 اشترك"):""}
function gate(){if(isSub())return true;if(S.used>=S.free){toast("انتهت دخولاتك المجانية اليوم، اشترك للمتابعة");return false}S.used=S.used+1;return true}

function ai(kind,topic){
  if(!gate())return "انتهت دخولاتك المجانية اليوم. اشترك لمتابعة استخدام الذكاء الاصطناعي.";
  var t=esc(topic);
  var res={
    "شرح مبسط":"شرح مبسط لـ «"+t+"»:\n١) الفكرة الأساسية بجملة واحدة.\n٢) مثال من الحياة اليومية.\n٣) أهم نقطة تتذكرها بالامتحان.",
    "ترجمة":"ترجمة «"+t+"» إلى الإنجليزية ستظهر هنا مع المصطلحات العلمية بجانب كل فقرة.",
    "تلخيص":"ملخص «"+t+"» بخمس نقاط قصيرة جاهز للمراجعة السريعة.",
    "أسئلة":"س١: ما المقصود بالموضوع الرئيسي في «"+t+"»؟\nأ) …  ب) …  ج) …  د) …\nس٢: علّل سبب أهمية الموضوع.\nس٣: صح أم خطأ: …",
    "اختبار":"اختبار من «"+t+"»: ١٠ أسئلة، المدة ١٥ دقيقة، مع تصحيح فوري وعرض الدرجة."
  }[kind]||"";
  return res+'\n\nأكمل بحسابك الشخصي: <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a> · <a href="https://gemini.google.com" target="_blank" rel="noopener">Gemini</a> · <a href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT</a>';
}

function setRole(r){S.role=r;S.tab=0;S.out="";S.open=null;S.gw=null;S.pp=null;S.bk=null;draw()}
function tab(i){
  var t=S.role=="pro"?5:3;
  if(i==t&&S.tab!=t&&!gate())return;
  S.tab=i;S.out="";S.open=null;S.gw=null;S.pp=null;S.bk=null;draw();
}
function hat(){
  S.taps++;clearTimeout(S._t);S._t=setTimeout(function(){S.taps=0},2000);
  if(S.taps>=5){S.taps=0;ask("أدخل رمز المالك",function(c){if(c===S.code)setRole("own");else toast("الرمز غير صحيح")},1)}
}
function head(t){
  return '<header><button class="hat" aria-label="مسبار" onclick="hat()">🎓</button><h1>'+t+'</h1>'+
  (stat()&&S.role!='own'?'<button class="b s" onclick="S.subv=1;draw()">'+stat()+'</button>':'')+
  (S.role?'<button class="b s" title="تبديل بين الأستاذ والطالب" onclick="setRole(null)">🔄 الدور</button>':'')+
  '<button class="b d" title="تسجيل الخروج النهائي" onclick="fbLogout()">خروج</button></header>';
}
function navb(items){return '<nav>'+items.map(function(x,i){return '<button class="'+(S.tab==i?'on':'')+'" onclick="tab('+i+')"><i>'+x[0]+'</i>'+x[1]+'</button>'}).join("")+'</nav>'}

/* ==================== بوابة الأوراق والملازم (نسخة س١ المتكاملة) ==================== */
var SUBJECTS=[
  {n:"العربي",ico:"ض",ltr:0,syms:["«","»","،","؛","؟","ـ","ّ","ً","ٌ","ٍ","ﷺ","ﷻ"]},
  {n:"الإنكليزي",ico:"E",ltr:1,syms:["___","?","!","'","\"","( )","[ ]","→","✓","✗"]},
  {n:"الإسلامية",ico:"الله",ltr:0,syms:["﷽","ﷻ","ﷺ","عليه السلام","رضي الله عنه","﴿","﴾","«","»"]},
  {n:"الفيزياء",ico:"F",ltr:0,syms:["Δ","λ","Ω","μ","°","×10","²","³","√","→","⇌","≈","≠"]},
  {n:"الكيمياء",ico:"H₂O",ltr:0,syms:["→","⇌","↑","↓","Δ","H₂O","CO₂","O₂","H₂","⁺","⁻","²","³"]},
  {n:"الأحياء",ico:"🧬",ltr:0,syms:["→","×","♂","♀","DNA","RNA","ATP","O₂","CO₂","%","°C"]},
  {n:"الاجتماعيات",ico:"🌍",ltr:0,syms:["م.","ق.م","هـ","°","شمالاً","جنوباً","شرقاً","غرباً","«","»"]},
  {n:"الرياضيات",ico:"Σ",ltr:0,syms:["√","²","³","π","∞","±","×","÷","≤","≥","≠","≈","∠","△","∫","Σ"]},
  {n:"الفرنسية",ico:"Fr",ltr:1,syms:["é","è","ê","ë","à","â","ç","ù","û","î","ï","ô","œ","___"]},
  {n:"الكردية",ico:"ک",ltr:0,syms:["ڕ","ڵ","ێ","ۆ","وو","ڤ","پ","چ","ژ","گ","«","»"]},
  {n:"التركية",ico:"Tr",ltr:1,syms:["ç","ğ","ı","İ","ö","ş","ü","Ç","Ğ","Ö","Ş","Ü","___"]},
  {n:"مادة عامة",ico:"س",ltr:0,syms:["___","( )","«»","؟","•","→","✓","✗","²","³","%"]}
];
var WLANGS=[
  {id:"ar",n:"العربية",rtl:1},
  {id:"en",n:"English",rtl:0},
  {id:"fr",n:"Français",rtl:0},
  {id:"tr",n:"Türkçe",rtl:0},
  {id:"cks",n:"کوردی (سورانی)",rtl:1},
  {id:"ckm",n:"Kurdî (Kurmancî)",rtl:0}
];
var COVER_STYLES=[
  "إطار مزدوج كلاسيكي","شريط جانبي عريض","بطاقة مركزية فاخرة","زوايا هندسية",
  "ترويسة علوية ملونة","إطار منقط أنيق","خطوط متوازية","شعار مركزي كبير",
  "تصميم أكاديمي رسمي","إطار ظل ناعم","شريط علوي وسفلي","مربع عنوان بارز",
  "زخرفة إسلامية هادئة","تقسيم ثنائي اللون","إطار رفيع عصري","نجمة أكاديمية",
  "خلفية فاتحة مؤطرة","عنوان بخط عريض","بطاقة مزدوجة","كلاسيكي بدون إطار"
];

function getSubjObj(name){return SUBJECTS.filter(function(x){return x.n==name})[0]||SUBJECTS[11]}
function insSym(elId,sym){
  var el=$(elId);if(!el)return;
  var s=el.selectionStart||0,e=el.selectionEnd||0,v=el.value;
  el.value=v.slice(0,s)+sym+v.slice(e);
  el.focus();el.selectionStart=el.selectionEnd=s+sym.length;
  el.dispatchEvent(new Event("input"));
}
function symBarH(elId,subjName){
  var main=getSubjObj(subjName),extra=["√","²","³","→","⇌","H₂O","___","«»","ﷺ"];
  var all=main.syms.concat(extra.filter(function(x){return main.syms.indexOf(x)<0}));
  return '<div class="symbar">'+all.map(function(s){return '<button type="button" onclick="insSym(\''+elId+'\',\''+esc(s).replace(/'/g,"\\'")+'\')">'+esc(s)+'</button>'}).join("")+'</div>';
}

/* الواجهة الرئيسية لبوابة الأوراق والملازم */
function gwHomeV(){
  var list=S.docs||[];
  return '<h2>📄 بوابة الأوراق والملازم</h2>'+
  '<div class="card" style="border-inline-start:4px solid var(--ac)">'+
    '<div class="row"><div class="grow"><b>أوراق الأسئلة والملازم</b><div class="mu">اكتب أسئلتك أو ملزمتك على الهاتف، ومسبار يرتبها لك في صفحات A4 جاهزة للطباعة.</div></div><span style="font-size:32px">🖨️</span></div>'+
    '<div class="grid" style="margin-top:10px">'+
      '<button class="b" onclick="S.gw={view:\'step1\'};draw()">+ إنشاء جديد</button>'+
      '<button class="b s" onclick="shareApp()">📤 مشاركة التطبيق</button>'+
    '</div>'+
  '</div>'+
  '<h2>مستنداتي ('+list.length+')</h2>'+
  (list.length?list.map(function(d,i){
    return '<div class="card">'+
      '<div class="row"><span class="badge">'+(d.kind=="b"?"📘 ملزمة":"📝 ورقة أسئلة")+'</span><b class="grow">'+esc(d.title||"بدون عنوان")+'</b><span class="mu">'+fd(d.at||Date.now())+'</span></div>'+
      '<div class="mu" style="margin:4px 0 8px">'+esc(d.subj||"")+(d.stage?' · '+esc(d.stage):'')+'</div>'+
      '<div class="row" style="flex-wrap:wrap">'+
        '<button class="b" onclick="openDoc('+i+')">فتح وتعديل</button>'+
        '<button class="b s" onclick="dupDoc('+i+')">نسخة</button>'+
        '<button class="b d" onclick="delDoc('+i+')">حذف</button>'+
      '</div>'+
    '</div>';
  }).join(""):'<div class="card mu">لا توجد مستندات محفوظة بعد. اضغط «+ إنشاء جديد» لعمل أول ورقة أسئلة أو ملزمة.</div>');
}
function shareApp(){
  var u=location.href;
  if(navigator.share)navigator.share({title:"مسبار AI",text:"أوراق الأسئلة والملازم الجاهزة للطباعة A4",url:u}).catch(function(){});
  else if(navigator.clipboard){navigator.clipboard.writeText(u);toast("تم نسخ رابط التطبيق")}
  else toast(u);
}
function saveCurrentDoc(kind,data){
  var id=data.docId||("doc_"+Date.now());data.docId=id;
  var meta={id:id,kind:kind,title:data.f.title||"بدون عنوان",subj:data.f.subj||"",stage:data.f.stage||"",at:Date.now(),data:JSON.parse(JSON.stringify(data))};
  var idx=S.docs.findIndex(function(x){return x.id==id});
  if(idx>-1)S.docs[idx]=meta;else S.docs.unshift(meta);
  saveDocsLocal();
  if(window.fbSaveDoc)window.fbSaveDoc(meta);
  toast("تم حفظ المستند في «مستنداتي»");
}
function openDoc(i){
  var d=S.docs[i];if(!d)return;
  if(d.kind=="q"){S.pp=JSON.parse(JSON.stringify(d.data));S.gw={view:"ed_q"}}
  else{S.bk=JSON.parse(JSON.stringify(d.data));S.gw={view:"ed_b"}}
  draw();
}
function dupDoc(i){
  var d=JSON.parse(JSON.stringify(S.docs[i]));
  d.id="doc_"+Date.now();d.title+=" (نسخة)";d.data.docId=d.id;d.data.f.title=d.title;d.at=Date.now();
  S.docs.unshift(d);saveDocsLocal();toast("تم نسخ المستند");draw();

function convDigits(str,mode){
  str=String(str==null?"":str);
  if(mode=="a")return str.replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩".charAt(d)});
  if(mode=="w")return str.replace(/[٠-٩]/g,function(d){return "0123456789".charAt("٠١٢٣٤٥٦٧٨٩".indexOf(d))});
  return str;
}

function paperH(){
  var p=S.pp,f=p.f,o=p.o,c=o.color||"#000000",rtl=isWlangRtl(o.wlang);
  var dg=function(t){return convDigits(t,o.digits)};
  var tdg=function(t){return convDigits(esc(t),o.txtDigits)};
  var lab=function(i){
    var n=dg(i+1);
    if(o.qn=="Q1")return "Q"+n+":";
    if(o.qn=="Q:")return "Q"+n+" /";
    if(o.qn=="Question")return "Question "+n+":";
    if(o.qn=="س:")return "س"+n+":";
    if(o.qn=="السؤال")return "السؤال "+n+":";
    return "س"+n;
  };
  var mk=function(j){
    var A=["أ","ب","ج","د","هـ","و","ز","ح"];
    var E="abcdefgh";
    if(o.sub=="أ،")return A[j%8]+"،";
    if(o.sub=="أ/")return A[j%8]+"/";
    if(o.sub=="أ)")return A[j%8]+")";
    if(o.sub=="1.")return dg(j+1)+".";
    if(o.sub=="1)")return dg(j+1)+")";
    if(o.sub=="1/")return dg(j+1)+"/";
    if(o.sub=="a/")return E.charAt(j%8)+"/";
    return E.charAt(j%8)+")";
  };
  var bdr="";
  if(o.border){
    if(o.borderStyle=="solid")bdr="border:2px solid "+c+";";
    else if(o.borderStyle=="dashed")bdr="border:2px dashed "+c+";";
    else if(o.borderStyle=="ornate")bdr="border:4px double "+c+";outline:1px solid "+c+";outline-offset:-7px;";
    else bdr="border:3px double "+c+";";
  }
  var ttLabel=f.tt=="مسمى مخصص"?(f.ttCustom||""):f.tt;
  var h='<div class="sheet" dir="'+(rtl?'rtl':'ltr')+'" style="font-family:'+esc(o.font)+',Tahoma,serif;font-size:'+o.size+'px;'+bdr+(o.bw?'filter:grayscale(1);':'')+'">';
  if(o.bism)h+='<div style="text-align:center;font-weight:700;margin-bottom:4px">بسم الله الرحمن الرحيم</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0">'+
    '<div style="flex:1;font-size:.9em">'+tdg(f.ministry)+(f.school?'<br><b>'+tdg(f.school)+'</b>':'')+'</div>'+
    '<div style="text-align:center">'+(o.logo?'<img src="'+o.logo+'" alt="" style="max-height:66px">':'')+'</div>'+
    '<div style="flex:1;text-align:end"><b style="color:'+c+';font-size:1.05em">'+tdg(f.title)+'</b><div style="font-size:.9em">'+tdg(f.subj)+(f.stage?' — '+tdg(f.stage):'')+'<br>'+tdg(f.round)+(f.year?' · '+dg(esc(f.year)):'')+'</div></div>'+
  '</div>';
  h+='<div style="display:flex;justify-content:space-between;border-top:1.5px solid '+c+';border-bottom:1.5px solid '+c+';padding:3px 8px;margin:6px 0;font-weight:600">'+
    '<span>'+(rtl?'الزمن: ':'Time: ')+tdg(f.dur)+'</span>'+
    '<span>'+(rtl?'الدرجة: ':'Total Marks: ')+dg(esc(f.grade))+'</span>'+
  '</div>';
  if(o.name)h+='<div style="margin:6px 0;font-size:.95em">'+(rtl?'اسم الطالب: ........................................ الشعبة: ............':'Student Name: ........................................ Class: ............')+'</div>';
  if(o.opt>0)h+='<div style="font-weight:700;color:'+c+';margin:4px 0">'+(rtl?'ملاحظة: أجب عن ('+dg(o.opt)+') من الأسئلة الآتية فقط.':'Note: Answer ('+dg(o.opt)+') of the following questions only.')+'</div>';
  if(o.note)h+='<div style="font-weight:600;background:#f8fafc;border-inline-start:3px solid '+c+';padding:3px 8px;margin:4px 0;font-size:.92em">'+tdg(o.note)+'</div>';

  p.q.forEach(function(q,i){
    if(i&&o.sep)h+='<hr>';
    var mTxt=q.m?(' ('+dg(esc(q.m))+(rtl?' درجات':' marks')+')'):'';
    h+='<div style="margin:7px 0"><div><b style="color:'+c+'">'+lab(i)+mTxt+'</b> '+tdg(q.t).replace(/\n/g,'<br>')+'</div>';
    if(q.img)h+='<div style="margin:6px 0;text-align:center"><img src="'+q.img+'" alt="" style="max-width:85%;max-height:180px;border-radius:6px"></div>';
    var ss=String(q.s||"").split("\n").filter(function(x){return x.trim()});
    if(ss.length){
      if(q.horiz){
        h+='<div style="display:flex;flex-wrap:wrap;gap:14px;padding-inline-start:18px;margin-top:4px">'+ss.map(function(s,j){return '<span><b>'+mk(j)+'</b> '+tdg(s)+'</span>'}).join("")+'</div>';
      }else{
        h+='<div style="margin-top:4px">'+ss.map(function(s,j){return '<div style="padding-inline-start:20px"><b>'+mk(j)+'</b> '+tdg(s)+'</div>'}).join("")+'</div>';
      }
    }
    h+='</div>';
  });

  h+='<div style="margin-top:'+o.closeSpace+'px">';
  if(o.close)h+='<div style="text-align:center;font-weight:700;color:'+c+'">'+tdg(o.close)+'</div>';
  if(o.sig)h+='<div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:600"><span>'+(ttLabel?tdg(ttLabel)+': ':'')+tdg(f.teacher)+'</span><span>'+(f.principal?(rtl?'مدير المدرسة: ':'Principal: ')+tdg(f.principal):'')+'</span></div>';
  h+='</div>';
  if(o.cont||o.pnum){
    h+='<div style="display:flex;justify-content:space-between;margin-top:14px;padding-top:4px;border-top:1px dotted #aaa;font-size:.8em;color:#555">'+
      '<span>'+(o.pnum?(rtl?'صفحة '+dg(1):'Page 1'):'')+'</span>'+
      '<span>'+(o.cont?(rtl?'يتبع...':'Continued...'):'')+'</span>'+
    '</div>';
  }
  return h+'</div>';
}

function bkLogo(inp){
  var x=inp.files[0];if(!x)return;
  var r=new FileReader();r.onload=function(){
    var im=new Image();im.onload=function(){
      var k=Math.min(1,280/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      S.bk.o.logo=c.toDataURL("image/png");draw();
    };im.src=r.result;
  };r.readAsDataURL(x);
}

function renderCoverPreview(f,o,mini){
  var c=o.coverColor||"#15803d",bg=o.coverBg||"#ffffff",st=o.coverStyle||0;
  var rtl=isWlangRtl(o.wlang),dg=function(t){return convDigits(t,o.digits)};
  var tdg=function(t){return convDigits(esc(t),o.txtDigits)};
  var ttLabel=f.tt=="مسمى مخصص"?(f.ttCustom||""):f.tt;
  var bdr="border:3px double "+c+";";
  var extra="";
  if(st%5==1)bdr="border-inline-start:14px solid "+c+";border-top:2px solid "+c+";border-bottom:2px solid "+c+";border-inline-end:2px solid "+c+";";
  else if(st%5==2)bdr="border:2px solid "+c+";border-radius:18px;";
  else if(st%5==3)bdr="border:4px solid "+c+";outline:2px dashed "+c+";outline-offset:-8px;";
  else if(st%5==4)bdr="border-top:18px solid "+c+";border-bottom:18px solid "+c+";border-left:1px solid "+c+";border-right:1px solid "+c+";";
  if(st>=10&&st<15)extra="background:linear-gradient(180deg,"+c+"14 0%,"+bg+" 35%,"+bg+" 65%,"+c+"14 100%);";

  if(mini){
    return '<div style="background:'+bg+';color:#111;'+bdr+extra+'height:78px;padding:6px;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;font-size:9px">'+
      '<div style="color:'+c+';font-weight:800">'+(st+1)+'</div>'+
      '<div style="font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+tdg(f.title)+'</div>'+
      '<div style="font-size:8px;color:#555">'+esc(COVER_STYLES[st])+'</div>'+
    '</div>';
  }

  return '<div class="bk-page bk-cover" dir="'+(rtl?'rtl':'ltr')+'" style="font-family:'+esc(o.font)+',Tahoma,serif;background:'+bg+';color:#111;'+bdr+extra+(o.bw?'filter:grayscale(1);':'')+'">'+
    '<div>'+
      '<div style="font-size:14px;color:#444">'+tdg(f.ministry)+'</div>'+
      (f.school?'<div style="font-weight:700;font-size:16px;margin-top:2px">'+tdg(f.school)+'</div>':'')+
      (o.logo?'<img src="'+o.logo+'" alt="" style="max-height:84px;margin-top:12px">':'')+
    '</div>'+
    '<div style="padding:18px 12px;margin:16px 0;'+(st%2==1?'background:'+c+'12;border-radius:14px;border:1px solid '+c+'44;':'')+'">'+
      '<div style="font-size:28px;font-weight:800;color:'+c+';line-height:1.4">'+tdg(f.title)+'</div>'+
      '<div style="width:90px;height:3px;background:'+c+';margin:10px auto;border-radius:3px"></div>'+
      '<div style="font-size:19px;font-weight:700">'+tdg(f.subj)+'</div>'+
      (f.stage?'<div style="font-size:16px;color:#333;margin-top:4px">'+tdg(f.stage)+'</div>':'')+
    '</div>'+
    '<div>'+
      (f.teacher?'<div style="font-size:16px;font-weight:700;color:'+c+'">'+(ttLabel?tdg(ttLabel)+': ':'')+tdg(f.teacher)+'</div>':'')+
      (f.year?'<div style="font-size:14px;color:#444;margin-top:6px">'+dg(esc(f.year))+'</div>':'')+
    '</div>'+
  '</div>';

      '<button class="b" style="background:#15803d;min-height:56px;font-size:16px" onclick="setRole(\'pro\')">👨‍🏫 أنا أستاذ</button>'+
      '<button class="b" style="min-height:56px;font-size:16px" onclick="setRole(\'stu\')">🎓 أنا طالب</button>'+
    '</div>'+
    '<button class="b s" style="width:100%;margin-top:14px" onclick="fbLogout()">🚪 تسجيل الخروج وتغيير الحساب</button></main>';
  }else if(r=="pro"){
    h=head("واجهة الأستاذ")+'<main>'+[toolsV,bagV,clsV,grV,txtV,aiV,chatV][S.tab]()+'</main>'+
      navb([["📄","الأوراق"],["🎒","الحقيبة"],["🏫","الكلاسات"],["📝","الدرجات"],["✨","النص"],["🤖","الذكاء"],["💬","المجتمع"]]);
  }else if(r=="stu"){
    h=head("واجهة الطالب")+'<main>'+[stuV,revV,txtV,aiV,chatV,filesV][S.tab]()+'</main>'+
      navb([["📚","كلاساتي"],["🧠","المراجعة"],["✨","النص"],["🤖","الذكاء"],["💬","المجتمع"],["📁","ملفاتي"]]);
  }else{
    h=head("لوحة المالك")+'<main>'+ownV()+'</main>';
  }
  $("app").className=r=="pro"?"pro":"";
  $("app").innerHTML=h;

  if(r=="pro"||r=="stu"){
    var t=r=="pro"?5:3;
    if(S.tab!=t){
      var fb=document.createElement("button");fb.id="fab";fb.className="b";fb.setAttribute("aria-label","الذكاء الاصطناعي");fb.textContent="🤖";
      fb.style.cssText="position:fixed;bottom:76px;inset-inline-start:14px;width:50px;height:50px;border-radius:25px;font-size:22px;padding:0;z-index:8";
      fb.onclick=function(){tab(t)};document.body.appendChild(fb);
    }

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,setPersistence,browserSessionPersistence} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,setDoc,updateDoc,deleteDoc,collection,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

var OWNER="alisalmankareem2@gmail.com";

var app=initializeApp({
  apiKey:"AIzaSyBpH-gVzeE0tGB1jvmdm7tXphamoq8fydg",
  authDomain:"misbar-ai.firebaseapp.com",
  projectId:"misbar-ai",
  storageBucket:"misbar-ai.firebasestorage.app",
  messagingSenderId:"268553428208",
  appId:"1:268553428208:web:82c01664fe2dd6e09ef635"
});
var auth=getAuth(app),db=getFirestore(app),unsubs=[],remotePlans=[];
var fail=function(e){toast(e&&e.code=="permission-denied"?"لا تملك الصلاحية (للمالك فقط)":"خطأ: "+((e&&e.code)||e))};
var err=function(e){console.error(e)};

/* تسجيل الدخول مع إجبار نافذة اختيار الحساب */
window.fbLogin=function(){
  var p=new GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account"});
  signInWithPopup(auth,p).catch(function(e){
    if(e.code=="auth/popup-blocked"||e.code=="auth/cancelled-popup-request")signInWithRedirect(auth,p);
    else if(e.code!="auth/popup-closed-by-user")toast("تعذر تسجيل الدخول: "+e.code);
  });
};

/* تسجيل خروج كامل ونهائي يمسح الحالة فوراً ويعيد لصفحة تسجيل الدخول */
window.fbLogout=function(){
  unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];
  S.uid=null;S.email="";S.role=null;S.isOwner=false;
  S.subv=0;S.tab=0;S.open=null;S.gw=null;S.pp=null;S.bk=null;
  S.subs=[];S.req=[];
  signOut(auth).then(function(){
    try{sessionStorage.clear()}catch(e){}
    toast("تم تسجيل الخروج بنجاح");
    draw();
  }).catch(function(){
    draw();
  });
};

onAuthStateChanged(auth,function(u){
  S.authReady=true;
  unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];
  S.subs=[];S.req=[];
  if(!u){
    S.subv=0;S.tab=0;S.open=null;S.uid=null;S.email="";S.role=null;S.isOwner=false;
    S.gw=null;S.pp=null;S.bk=null;
    draw();return;
  }
  S.uid=u.uid;S.email=(u.email||"").toLowerCase();
  S.isOwner=S.email==OWNER.toLowerCase()&&u.emailVerified;
  setDoc(doc(db,"users",u.uid),{email:S.email,name:u.displayName||""},{merge:true}).catch(err);

  unsubs.push(onSnapshot(collection(db,"plans"),function(s){
    var a=[];remotePlans=[];
    s.forEach(function(d){var x=d.data();x.id=d.id;remotePlans.push(d.id);a.push(x)});
    a.sort(function(x,y){return (x.o||0)-(y.o||0)});
    if(!s.empty||!S.isOwner)S.plans=a;
    if(s.empty&&S.isOwner&&!S.seeded){S.seeded=1;setTimeout(function(){window.savePlans()},600)}
    draw();
  },err));

  if(S.isOwner){
    unsubs.push(onSnapshot(collection(db,"requests"),function(s){
      var a=[];s.forEach(function(d){var x=d.data();x.id=Number(d.id);a.push(x)});
      a.sort(function(x,y){return y.d-x.d});S.req=a;draw();
    },err));
    unsubs.push(onSnapshot(collection(db,"subscriptions"),function(s){
      var a=[];s.forEach(function(d){var x=d.data();x.uid=d.id;a.push(x)});
      S.subs=a;draw();
    },err));
  }else{
    unsubs.push(onSnapshot(query(collection(db,"requests"),where("uid","==",u.uid)),function(s){
      var a=[];s.forEach(function(d){var x=d.data();x.id=Number(d.id);a.push(x)});
      a.sort(function(x,y){return y.d-x.d});S.req=a;draw();
    },err));
    unsubs.push(onSnapshot(doc(db,"subscriptions",u.uid),function(s){
      S.subs=s.exists()?[{uid:u.uid,e:S.email,n:s.data().n,s:s.data().s,end:s.data().end}]:[];
      draw();
    },err));
  }
  draw();
});

window.sendReq=function(){
  var p=S.plans[S.pick];if(!p){toast("اختر باقة أولاً");return}
  if(S.req.some(function(r){return r.pid==pid(p)&&r.st=="new"})){toast("لديك طلب معلق لهذه الباقة");return}
  var id=Date.now();
  setDoc(doc(db,"requests",String(id)),{uid:S.uid,e:S.email,pid:pid(p),n:String(p.n),p:Number(p.p)||0,v:Number(p.v)||1,u:p.u,d:id,st:"new"})
    .then(function(){S.pick=null;toast("أُرسل طلبك للمالك")}).catch(fail);
};
window.reqSt=function(id,st){updateDoc(doc(db,"requests",String(id)),{st:st}).catch(fail)};
function subOf(uid){return S.subs.filter(function(s){return s.uid==uid})[0]}
window.actv=function(id){
  var r=gr(id),v=$("sd"+id).value,now=Date.now(),cur=subOf(r.uid),st=v?new Date(v+"T00:00:00").getTime():now;
  if(cur&&cur.end>now)st=cur.end;
  setDoc(doc(db,"subscriptions",r.uid),{e:r.e,n:r.n,s:cur&&cur.end>now?cur.s:st,end:st+dd(r)*864e5})
    .then(function(){return updateDoc(doc(db,"requests",String(id)),{st:"act"})}).catch(fail);
};
window.extR=function(id){
  var r=gr(id),now=Date.now(),cur=subOf(r.uid),base=cur&&cur.end>now?cur.end:now;
  setDoc(doc(db,"subscriptions",r.uid),{e:r.e,n:r.n,s:cur&&cur.end>now?cur.s:now,end:base+dd(r)*864e5})
    .then(function(){toast("تم التمديد")}).catch(fail);
};
window.stopR=function(id){
  var r=gr(id);
  setDoc(doc(db,"subscriptions",r.uid),{end:Date.now()},{merge:true})
    .then(function(){return updateDoc(doc(db,"requests",String(id)),{st:"no"})}).catch(fail);
};
window.savePlans=function(){
  var keep={};
  S.plans.forEach(function(p,i){
    keep[pid(p)]=1;
    setDoc(doc(db,"plans",pid(p)),{n:String(p.n),p:Number(p.p)||0,v:Number(p.v)||1,u:p.u,f:p.f||"",hide:!!p.hide,o:i}).catch(fail);
  });
  remotePlans.forEach(function(id){if(!keep[id])deleteDoc(doc(db,"plans",id)).catch(fail)});
  toast("تم حفظ الباقات ونشرها");
};
</script>
</body>
</html>
